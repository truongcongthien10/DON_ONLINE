<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Tổng Hợp Đơn Online - HueWACO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .table-custom { width: 100%; border-collapse: collapse; }
        .table-custom th, .table-custom td { border: 1px solid #cbd5e1; box-sizing: border-box; }
        .table-custom input { width: 100%; text-align: center; border: 1px solid #94a3b8; border-radius: 4px; padding: 3px 0; font-size: 13px; }
        .table-custom input:focus { outline: 2px solid #2563eb; background-color: #fef08a !important; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <header class="bg-blue-900 text-white p-4 shadow-md border-b-4 border-yellow-500">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold uppercase">TỔNG HỢP ĐƠN ONLINE - HUEWACO</h1>
                <p class="text-xs text-blue-200">Hệ thống theo dõi & tổng hợp tiến độ</p>
            </div>
            <span class="text-xs bg-yellow-500 text-blue-950 font-bold px-3 py-1 rounded">GitHub Pages</span>
        </div>
    </header>

    <div class="container mx-auto p-4 space-y-4">

        <!-- Bộ Lọc Đã Bổ Sung Chọn Dịch Vụ -->
        <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-6 gap-3 items-end">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">CHỌN NĂM:</label>
                <select id="selectYear" onchange="updateWeekDropdown(); loadData();" class="w-full border border-slate-300 rounded p-2 text-sm font-semibold"></select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">CHỌN THÁNG:</label>
                <select id="selectMonth" onchange="updateWeekDropdown(); loadData();" class="w-full border border-slate-300 rounded p-2 text-sm font-semibold"></select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">KỲ BÁO CÁO:</label>
                <select id="selectPeriod" onchange="loadData()" class="w-full border border-slate-300 rounded p-2 text-sm font-bold text-blue-800"></select>
            </div>
            <div>
                <label class="block text-xs font-bold text-blue-900 mb-1">LOẠI DỊCH VỤ:</label>
                <select id="selectCategoryFilter" onchange="filterCategoryView()" class="w-full border-2 border-blue-600 rounded p-2 text-sm font-bold text-blue-900 bg-blue-50">
                    <option value="ALL">-- Hiển thị Tất Cả Dịch Vụ --</option>
                    <option value="1">1. Lắp đặt</option>
                    <option value="2">2. Cải tạo</option>
                    <option value="3">3. Nâng dời hạ</option>
                    <option value="4">4. Dò tìm</option>
                    <option value="5">5. Phụ lục</option>
                    <option value="6">6. Kiểm định ĐH</option>
                    <option value="7">7. Tạm ngừng</option>
                    <option value="8">8. Cắt hủy</option>
                    <option value="9">9. Mở nước</option>
                    <option value="10">10. Kiểm tra ĐH</option>
                </select>
            </div>
            <div>
                <button onclick="loadData()" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-2 rounded shadow-sm text-sm">🔍 Xem / Tra Cứu</button>
            </div>
            <div>
                <button id="btnSave" onclick="saveData()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded shadow-sm text-sm">💾 Lưu Số Liệu</button>
            </div>
        </div>

        <!-- Khung Bảng -->
        <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200 overflow-x-auto">
            <div class="flex justify-between items-center mb-3">
                <h2 id="tableTitle" class="text-base font-bold text-blue-900 uppercase">Số Liệu Báo Cáo Đơn Online</h2>
                <span id="readOnlyNotice" class="hidden text-xs bg-amber-100 text-amber-800 font-bold px-2.5 py-1 rounded border border-amber-300">🔒 Chế độ Tổng hợp</span>
            </div>
            
            <table class="table-custom text-xs text-center text-slate-700" id="mainTable">
                <thead id="tableHead" class="text-white uppercase font-bold"></thead>
                <tbody id="cmaTableBody"></tbody>
                <tfoot id="cmaTableFoot" class="bg-slate-200 font-bold text-slate-900"></tfoot>
            </table>
        </div>
    </div>

    <script>
        const cmaList = ["Phú Xuân", "Thuận Hóa", "A Lưới", "Kim Long", "Hương Trà", "Phong Điền", "Hương Thủy", "Phú Vang", "Phú Lộc"];
        const categories = ["Lắp đặt", "Cải tạo", "Nâng dời hạ", "Dò tìm", "Phụ lục", "Kiểm định ĐH", "Tạm ngừng", "Cắt hủy", "Mở nước", "Kiểm tra ĐH"];

        function padZero(num) { return num < 10 ? '0' + num : num; }

        function updateWeekDropdown() {
            const year = parseInt(document.getElementById('selectYear').value) || 2026;
            const monthStr = document.getElementById('selectMonth').value || "M9";
            const month = parseInt(monthStr.replace('M', ''));
            const selectPeriod = document.getElementById('selectPeriod');
            const currentSelected = selectPeriod.value;
            selectPeriod.innerHTML = '';

            const daysInMonth = new Date(year, month, 0).getDate();
            const weeks = [
                { id: "W1", name: "Tuần 1", start: 1, end: 7 },
                { id: "W2", name: "Tuần 2", start: 8, end: 14 },
                { id: "W3", name: "Tuần 3", start: 15, end: 21 },
                { id: "W4", name: "Tuần 4", start: 22, end: 28 },
                { id: "W5", name: "Tuần 5", start: 29, end: daysInMonth }
            ];

            weeks.forEach(w => {
                if (w.start <= daysInMonth) {
                    let opt = document.createElement('option');
                    opt.value = w.id;
                    opt.textContent = `${w.name} (${padZero(w.start)}/${padZero(month)} - ${padZero(Math.min(w.end, daysInMonth))}/${padZero(month)})`;
                    selectPeriod.appendChild(opt);
                }
            });

            let optMonth = document.createElement('option');
            optMonth.value = "MONTH";
            optMonth.className = "font-bold text-emerald-700";
            optMonth.textContent = `-- Tổng Hợp Cả Tháng ${month}/${year} --`;
            selectPeriod.appendChild(optMonth);

            if (currentSelected && Array.from(selectPeriod.options).some(o => o.value === currentSelected)) {
                selectPeriod.value = currentSelected;
            }
        }

        function initTime() {
            const selectYear = document.getElementById('selectYear');
            const selectMonth = document.getElementById('selectMonth');
            const now = new Date();

            for (let y = 2024; y <= 2030; y++) {
                let opt = document.createElement('option');
                opt.value = y; opt.textContent = "Năm " + y;
                if (y === now.getFullYear()) opt.selected = true;
                selectYear.appendChild(opt);
            }
            for (let m = 1; m <= 12; m++) {
                let opt = document.createElement('option');
                opt.value = "M" + m; opt.textContent = "Tháng " + m;
                if (m === (now.getMonth() + 1)) opt.selected = true;
                selectMonth.appendChild(opt);
            }
            updateWeekDropdown();
        }

        function filterCategoryView() {
            loadData();
        }

        function renderTableHeader(filter) {
            const thead = document.getElementById('tableHead');
            let h1 = `<tr class="bg-blue-900">
                <th rowspan="2" class="p-2 bg-slate-900 w-12">STT</th>
                <th rowspan="2" class="p-2 bg-slate-900 w-32">KHU VỰC</th>
                <th colspan="3" class="p-2 bg-amber-600 text-yellow-100">TỔNG HỢP</th>`;
            
            let h2 = `<tr class="bg-slate-800 text-yellow-300 text-[11px]">
                <th class="p-1 bg-amber-700 w-14">TỔNG</th>
                <th class="p-1 bg-amber-700 w-14">ONLINE</th>
                <th class="p-1 bg-amber-700 w-12">%</th>`;

            categories.forEach((catName, idx) => {
                let catId = idx + 1;
                if (filter === "ALL" || filter == catId) {
                    h1 += `<th colspan="3" class="p-2 bg-blue-800">${catName}</th>`;
                    h2 += `<th class="p-1 bg-slate-800">TỔNG</th><th class="p-1 bg-slate-800">ONLINE</th><th class="p-1 bg-slate-800 text-yellow-400">%</th>`;
                }
            });

            h1 += `</tr>`; h2 += `</tr>`;
            thead.innerHTML = h1 + h2;
        }

        function renderTableRows(isReadOnly = false) {
            const filter = document.getElementById('selectCategoryFilter').value;
            renderTableHeader(filter);

            const tbody = document.getElementById('cmaTableBody');
            tbody.innerHTML = '';

            cmaList.forEach((cma, idx) => {
                let tr = document.createElement('tr');
                tr.className = idx % 2 === 0 ? 'bg-white hover:bg-slate-50' : 'bg-slate-50 hover:bg-slate-100';
                
                let html = `
                    <td class="p-2 bg-slate-900 text-white font-medium">${idx + 1}</td>
                    <td class="p-2 bg-slate-900 text-white font-bold text-left">${cma}</td>
                    <td class="p-1 font-bold text-blue-900 bg-amber-100 row-total-all">0</td>
                    <td class="p-1 font-bold text-emerald-800 bg-amber-100 row-online-all">0</td>
                    <td class="p-1 font-bold text-amber-900 bg-amber-200 row-pct-all">0%</td>
                `;

                categories.forEach((_, cIdx) => {
                    let c = cIdx + 1;
                    if (filter === "ALL" || filter == c) {
                        if (isReadOnly) {
                            html += `
                                <td class="p-1 font-semibold cat-tot-${c}">0</td>
                                <td class="p-1 font-semibold text-emerald-700 cat-on-${c}">0</td>
                                <td class="p-1 font-bold text-blue-700 cat-pct-${c}">0%</td>
                            `;
                        } else {
                            html += `
                                <td class="p-1"><input type="number" min="0" class="tot-${c}" value="0" onfocus="this.select()" onchange="calculateRow(this)"></td>
                                <td class="p-1"><input type="number" min="0" class="on-${c} text-emerald-700 font-medium" value="0" onfocus="this.select()" onchange="calculateRow(this)"></td>
                                <td class="p-1 font-bold text-blue-700 pct-${c}">0%</td>
                            `;
                        }
                    }
                });

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });

            renderFooter(filter);
        }

        function renderFooter(filter) {
            const tfoot = document.getElementById('cmaTableFoot');
            let html = `
                <tr>
                    <td class="p-2 bg-slate-950 text-white">--</td>
                    <td class="p-2 bg-slate-950 text-white">HueWACO</td>
                    <td id="footTotalAll" class="p-2 bg-amber-600 text-white">0</td>
                    <td id="footOnlineAll" class="p-2 bg-amber-600 text-white">0</td>
                    <td id="footPctAll" class="p-2 bg-amber-700 text-white">0%</td>
            `;

            categories.forEach((_, cIdx) => {
                let c = cIdx + 1;
                if (filter === "ALL" || filter == c) {
                    html += `
                        <td id="footCatTot-${c}" class="p-1 bg-slate-200">0</td>
                        <td id="footCatOn-${c}" class="p-1 text-emerald-800 bg-slate-200">0</td>
                        <td id="footCatPct-${c}" class="p-1 text-blue-900 bg-slate-200">0%</td>
                    `;
                }
            });
            html += `</tr>`;
            tfoot.innerHTML = html;
        }

        function calculateRow(element) {
            let row = element.closest('tr');
            let grandTotal = 0, grandOnline = 0;

            categories.forEach((_, cIdx) => {
                let c = cIdx + 1;
                let totElem = row.querySelector(`.tot-${c}`);
                let onElem = row.querySelector(`.on-${c}`);
                let pctElem = row.querySelector(`.pct-${c}`);

                let tot = totElem ? (parseFloat(totElem.value) || 0) : 0;
                let on = onElem ? (parseFloat(onElem.value) || 0) : 0;

                if (pctElem) {
                    pctElem.textContent = tot > 0 ? Math.round((on / tot) * 100) + '%' : '0%';
                }

                grandTotal += tot;
                grandOnline += on;
            });

            row.querySelector('.row-total-all').textContent = grandTotal;
            row.querySelector('.row-online-all').textContent = grandOnline;
            row.querySelector('.row-pct-all').textContent = grandTotal > 0 ? Math.round((grandOnline / grandTotal) * 100) + '%' : '0%';

            calculateTableTotals();
        }

        function calculateTableTotals() {
            let period = document.getElementById('selectPeriod').value;
            let filter = document.getElementById('selectCategoryFilter').value;
            let rows = document.querySelectorAll('#cmaTableBody tr');
            
            let footTotAll = 0, footOnAll = 0;
            let catTotals = Array(categories.length + 1).fill(0);
            let catOnlines = Array(categories.length + 1).fill(0);

            rows.forEach(row => {
                footTotAll += parseFloat(row.querySelector('.row-total-all').textContent) || 0;
                footOnAll += parseFloat(row.querySelector('.row-online-all').textContent) || 0;

                categories.forEach((_, cIdx) => {
                    let c = cIdx + 1;
                    if (filter === "ALL" || filter == c) {
                        let tot = period === 'MONTH' 
                            ? (parseFloat(row.querySelector(`.cat-tot-${c}`)?.textContent) || 0)
                            : (parseFloat(row.querySelector(`.tot-${c}`)?.value) || 0);
                        let on = period === 'MONTH'
                            ? (parseFloat(row.querySelector(`.cat-on-${c}`)?.textContent) || 0)
                            : (parseFloat(row.querySelector(`.on-${c}`)?.value) || 0);

                        catTotals[c] += tot;
                        catOnlines[c] += on;
                    }
                });
            });

            document.getElementById('footTotalAll').textContent = footTotAll;
            document.getElementById('footOnlineAll').textContent = footOnAll;
            document.getElementById('footPctAll').textContent = footTotAll > 0 ? Math.round((footOnAll / footTotAll) * 100) + '%' : '0%';

            categories.forEach((_, cIdx) => {
                let c = cIdx + 1;
                if (filter === "ALL" || filter == c) {
                    let totCell = document.getElementById(`footCatTot-${c}`);
                    let onCell = document.getElementById(`footCatOn-${c}`);
                    let pctCell = document.getElementById(`footCatPct-${c}`);

                    if (totCell) totCell.textContent = catTotals[c];
                    if (onCell) onCell.textContent = catOnlines[c];
                    if (pctCell) pctCell.textContent = catTotals[c] > 0 ? Math.round((catOnlines[c] / catTotals[c]) * 100) + '%' : '0%';
                }
            });
        }

        function saveData() {
            let year = document.getElementById('selectYear').value;
            let month = document.getElementById('selectMonth').value;
            let period = document.getElementById('selectPeriod').value;

            if (period === 'MONTH') {
                alert('Không thể lưu ở chế độ Tổng hợp Tháng!');
                return;
            }

            let key = `HUEWACO_${year}_${month}_${period}`;
            let data = [];

            document.querySelectorAll('#cmaTableBody tr').forEach((row, idx) => {
                let rowData = { cma: cmaList[idx], categories: [] };
                categories.forEach((_, cIdx) => {
                    let c = cIdx + 1;
                    let totVal = row.querySelector(`.tot-${c}`)?.value || "0";
                    let onVal = row.querySelector(`.on-${c}`)?.value || "0";
                    rowData.categories.push({ tot: totVal, on: onVal });
                });
                data.push(rowData);
            });

            localStorage.setItem(key, JSON.stringify(data));
            alert(`Lưu thành công số liệu ${period} - ${month} - ${year}!`);
        }

        function loadData() {
            let year = document.getElementById('selectYear').value;
            let month = document.getElementById('selectMonth').value;
            let period = document.getElementById('selectPeriod').value;
            let filter = document.getElementById('selectCategoryFilter').value;

            const btnSave = document.getElementById('btnSave');
            const notice = document.getElementById('readOnlyNotice');

            if (period === 'MONTH') {
                btnSave.classList.add('hidden');
                notice.classList.remove('hidden');
                document.getElementById('tableTitle').textContent = `TỔNG HỢP THÁNG ${month.replace('M','')} - NĂM ${year}`;

                renderTableRows(true);

                let aggregated = cmaList.map(cma => ({
                    cma: cma,
                    categories: Array.from({length: categories.length}, () => ({tot: 0, on: 0}))
                }));

                ['W1','W2','W3','W4','W5'].forEach(w => {
                    let weekData = localStorage.getItem(`HUEWACO_${year}_${month}_${w}`);
                    if (weekData) {
                        let parsed = JSON.parse(weekData);
                        parsed.forEach((r, rIdx) => {
                            r.categories.forEach((cat, cIdx) => {
                                aggregated[rIdx].categories[cIdx].tot += parseFloat(cat.tot) || 0;
                                aggregated[rIdx].categories[cIdx].on += parseFloat(cat.on) || 0;
                            });
                        });
                    }
                });

                let rows = document.querySelectorAll('#cmaTableBody tr');
                aggregated.forEach((rData, rIdx) => {
                    let row = rows[rIdx];
                    let rTotAll = 0, rOnAll = 0;

                    rData.categories.forEach((cat, cIdx) => {
                        let c = cIdx + 1;
                        if (filter === "ALL" || filter == c) {
                            let totElem = row.querySelector(`.cat-tot-${c}`);
                            let onElem = row.querySelector(`.cat-on-${c}`);
                            let pctElem = row.querySelector(`.cat-pct-${c}`);

                            if (totElem) totElem.textContent = cat.tot;
                            if (onElem) onElem.textContent = cat.on;
                            if (pctElem) pctElem.textContent = cat.tot > 0 ? Math.round((cat.on / cat.tot) * 100) + '%' : '0%';
                        }
                        rTotAll += cat.tot;
                        rOnAll += cat.on;
                    });

                    row.querySelector('.row-total-all').textContent = rTotAll;
                    row.querySelector('.row-online-all').textContent = rOnAll;
                    row.querySelector('.row-pct-all').textContent = rTotAll > 0 ? Math.round((rOnAll / rTotAll) * 100) + '%' : '0%';
                });

                calculateTableTotals();

            } else {
                btnSave.classList.remove('hidden');
                notice.classList.add('hidden');
                document.getElementById('tableTitle').textContent = `NHẬP LIỆU ${period} - THÁNG ${month.replace('M','')} - NĂM ${year}`;

                renderTableRows(false);

                let saved = localStorage.getItem(`HUEWACO_${year}_${month}_${period}`);
                if (saved) {
                    let data = JSON.parse(saved);
                    let rows = document.querySelectorAll('#cmaTableBody tr');
                    data.forEach((rData, rIdx) => {
                        let row = rows[rIdx];
                        if (row) {
                            rData.categories.forEach((cat, cIdx) => {
                                let c = cIdx + 1;
                                if (row.querySelector(`.tot-${c}`)) row.querySelector(`.tot-${c}`).value = cat.tot;
                                if (row.querySelector(`.on-${c}`)) row.querySelector(`.on-${c}`).value = cat.on;
                            });
                            calculateRow(row.querySelector('input'));
                        }
                    });
                }
            }
        }

        initTime();
        loadData();
    </script>
</body>
</html>
