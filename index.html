<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Tổng Hợp Đơn Online - HueWACO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box !important; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }

        /* Triệt tiêu mũi tên tăng giảm số */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* BẢNG TÍNH LƯỚI EXCEL CHUẨN */
        .excel-table {
            table-layout: fixed !important;
            border-collapse: separate !important;
            border-spacing: 0 !important;
            background-color: #ffffff;
            border-top: 1px solid #cbd5e1;
            font-size: 12px;
        }

        .excel-table th, 
        .excel-table td {
            border-right: 1px solid #cbd5e1 !important;
            border-bottom: 1px solid #cbd5e1 !important;
            padding: 0;
            white-space: nowrap;
            vertical-align: middle;
            overflow: hidden;
            text-align: center;
        }

        #fixedTable { border-left: 1px solid #cbd5e1; }
        .border-split-right { border-right: 2px solid #0f172a !important; }

        .excel-table th.h-header-top { height: 48px !important; font-size: 13px; }
        .excel-table th.h-header-sub { height: 36px !important; }
        .excel-table tr, .excel-table td { height: 28px !important; }

        /* Ô nhập liệu */
        .excel-table input {
            width: 100%; height: 100%;
            background: transparent; border: none !important;
            border-radius: 0 !important; text-align: center;
            font-size: 12px; outline: none; margin: 0; padding: 0; color: #0f172a;
        }

        .excel-table input:focus {
            background-color: #fef08a !important;
            box-shadow: inset 0 0 0 2px #2563eb !important;
            font-weight: bold;
        }

        /* Màu nền các phân khu */
        .bg-excel-header { background-color: #1e3a8a; } 
        .bg-excel-cma { background-color: #0f172a; color: #ffffff; } 
        .bg-excel-total-light { background-color: #fef3c7; }
        .bg-excel-foot { background-color: #1e293b; color: #ffffff; }

        /* Custom Scrollbar */
        .scrollable-table-container::-webkit-scrollbar { height: 10px; }
        .scrollable-table-container::-webkit-scrollbar-track { background: #f1f5f9; }
        .scrollable-table-container::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .scrollable-table-container::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="p-4">

    <!-- Header HueWACO -->
    <header class="relative bg-blue-900 text-white p-4 rounded shadow-md border-b-4 border-yellow-500 mb-4">
        <div class="relative z-10 text-center">
            <h1 class="text-xl font-bold uppercase tracking-wide">CÔNG TY CỔ PHẦN CẤP NƯỚC THỪA THIÊN HUẾ (HUEWACO)</h1>
            <p class="text-xs font-light mt-1 text-blue-200">Hệ Thống Báo Cáo Tổng Hợp Tiến Độ Đơn Online</p>
        </div>
    </header>

    <!-- Thanh Điều Khiển & Bộ Lọc -->
    <div class="bg-white p-3 rounded shadow-sm border border-slate-200 mb-4 flex flex-wrap gap-3 items-center justify-between">
        <div class="flex items-center gap-3">
            <span id="tableTitle" class="text-sm font-bold text-blue-900 uppercase tracking-wide">
                NHẬP LIỆU BÁO CÁO
            </span>
            <span id="readOnlyNotice" class="hidden text-xs bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded border border-amber-300">
                🔒 Chế độ Tổng hợp (Chỉ xem)
            </span>
        </div>

        <div class="flex flex-wrap items-center gap-2">
            <div>
                <select id="selectYear" onchange="updateWeekDropdown(); loadData();" class="border border-slate-300 rounded px-2 py-1 text-xs font-semibold focus:ring-2 focus:ring-blue-600">
                </select>
            </div>
            <div>
                <select id="selectMonth" onchange="updateWeekDropdown(); loadData();" class="border border-slate-300 rounded px-2 py-1 text-xs font-semibold focus:ring-2 focus:ring-blue-600">
                </select>
            </div>
            <div>
                <select id="selectPeriod" onchange="loadData()" class="border border-slate-300 rounded px-2 py-1 text-xs font-bold text-blue-800 focus:ring-2 focus:ring-blue-600">
                </select>
            </div>
            <div>
                <select id="selectCategoryFilter" onchange="filterCategoryView()" class="border-2 border-blue-600 rounded px-2 py-1 text-xs font-bold text-blue-900 bg-blue-50 focus:ring-2 focus:ring-blue-600">
                    <option value="ALL">-- Hiển thị Tất Cả Hạng Mục --</option>
                    <option value="1">1. Lắp đặt</option>
                    <option value="2">2. Cải tạo</option>
                    <option value="3">3. Nâng dời hạ</option>
                    <option value="4">4. Dò tìm</option>
                    <option value="5">5. Kiểm định ĐH</option>
                    <option value="6">6. Tạm ngừng</option>
                    <option value="7">7. Cắt hủy</option>
                    <option value="8">8. Mở nước</option>
                    <option value="9">9. Kiểm tra ĐH</option>
                </select>
            </div>
            <button id="btnSave" onclick="saveData()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1 rounded text-xs shadow-sm">
                💾 Lưu Số Liệu
            </button>
        </div>
    </div>

    <!-- KHUNG CHỨA SPLIT-TABLE -->
    <div class="bg-white border border-slate-300 rounded shadow-sm overflow-hidden flex flex-nowrap">
        
        <!-- 1. BẢNG CỐ ĐỊNH BÊN TRÁI -->
        <div class="flex-none z-10 bg-white">
            <table class="excel-table text-center" id="fixedTable" style="width: 320px;">
                <thead>
                    <tr class="bg-excel-header text-white font-bold uppercase">
                        <th rowspan="2" style="width: 40px;" class="header-row-top bg-slate-900">STT</th>
                        <th rowspan="2" style="width: 100px;" class="header-row-top bg-slate-900">KHU VỰC</th>
                        <th colspan="3" style="width: 180px;" class="header-row-top bg-amber-600 text-yellow-100 border-split-right">TỔNG HỢP</th>
                    </tr>
                    <tr class="bg-slate-800 text-yellow-300 text-[11px] font-bold uppercase">
                        <th style="width: 60px;" class="header-row-sub bg-amber-700">TỔNG</th>
                        <th style="width: 60px;" class="header-row-sub bg-amber-700">ONLINE</th>
                        <th style="width: 60px;" class="header-row-sub bg-amber-700 border-split-right">%</th>
                    </tr>
                </thead>
                <tbody id="fixedTableBody"></tbody>
                <tfoot id="fixedTableFoot"></tfoot>
            </table>
        </div>

        <!-- 2. BẢNG NHẬP LIỆU CUỘN BÊN PHẢI -->
        <div class="flex-1 overflow-x-auto bg-white scrollable-table-container">
            <table class="excel-table text-center" id="scrollableTable">
                <thead id="scrollableHeader"></thead>
                <tbody id="scrollableTableBody"></tbody>
                <tfoot id="scrollableTableFoot"></tfoot>
            </table>
        </div>

    </div>

    <script>
        const cmaList = ["Phú Xuân", "Thuận Hóa", "A Lưới", "Kim Long", "Hương Trà", "Phong Điền", "Hương Thủy", "Phú Vang", "Phú Lộc"];
        const categories = ["Lắp đặt", "Cải tạo", "Nâng dời hạ", "Dò tìm", "Kiểm định ĐH", "Tạm ngừng", "Cắt hủy", "Mở nước", "Kiểm tra ĐH"];

        function padZero(num) { return num < 10 ? '0' + num : num; }

        function isIntegerKey(evt) {
            const charCode = (evt.which) ? evt.which : evt.keyCode;
            if ([8, 9, 27, 13, 46, 37, 38, 39, 40].indexOf(charCode) !== -1 ||
                (charCode >= 48 && charCode <= 57) || (charCode >= 96 && charCode <= 105)) {
                return true;
            }
            evt.preventDefault();
            return false;
        }

        function cleanIntegerInput(input) {
            input.value = input.value.replace(/[^0-9]/g, '');
        }

        const weekNames = { "W1": "Tuần 1", "W2": "Tuần 2", "W3": "Tuần 3", "W4": "Tuần 4", "W5": "Tuần 5" };

        function updateWeekDropdown() {
            const year = parseInt(document.getElementById('selectYear').value) || 2026;
            const monthStr = document.getElementById('selectMonth').value || "M9";
            const month = parseInt(monthStr.replace('M', ''));
            const selectPeriod = document.getElementById('selectPeriod');

            const currentSelected = selectPeriod.value;
            selectPeriod.innerHTML = '';

            const daysInMonth = new Date(year, month, 0).getDate();
            const weeks = [
                { id: "W1", name: "Tuần 1", start: 1, end: 7 },
                { id: "W2", name: "Tuần 2", start: 8, end: 14 },
                { id: "W3", name: "Tuần 3", start: 15, end: 21 },
                { id: "W4", name: "Tuần 4", start: 22, end: 28 },
                { id: "W5", name: "Tuần 5", start: 29, end: daysInMonth }
            ];

            weeks.forEach(w => {
                if (w.start <= daysInMonth) {
                    let opt = document.createElement('option');
                    opt.value = w.id;
                    opt.textContent = `${w.name} (${padZero(w.start)}/${padZero(month)} đến ${padZero(Math.min(w.end, daysInMonth))}/${padZero(month)})`;
                    selectPeriod.appendChild(opt);
                }
            });

            let optMonth = document.createElement('option');
            optMonth.value = "MONTH";
            optMonth.className = "font-bold text-emerald-700";
            optMonth.textContent = `-- Tổng Hợp Cả Tháng ${month}/${year} --`;
            selectPeriod.appendChild(optMonth);

            const quarters = [
                { id: "Q1", name: "Tổng Hợp Quý I (Tháng 1 - 3)" },
                { id: "Q2", name: "Tổng Hợp Quý II (Tháng 4 - 6)" },
                { id: "Q3", name: "Tổng Hợp Quý III (Tháng 7 - 9)" },
                { id: "Q4", name: "Tổng Hợp Quý IV (Tháng 10 - 12)" }
            ];

            quarters.forEach(q => {
                let opt = document.createElement('option');
                opt.value = q.id;
                opt.className = "font-bold text-blue-700";
                opt.textContent = `-- ${q.name} --`;
                selectPeriod.appendChild(opt);
            });

            let optYear = document.createElement('option');
            optYear.value = "YEAR";
            optYear.className = "font-bold text-purple-700";
            optYear.textContent = `-- TỔNG HỢP CẢ NĂM ${year} --`;
            selectPeriod.appendChild(optYear);

            if (currentSelected && Array.from(selectPeriod.options).some(o => o.value === currentSelected)) {
                selectPeriod.value = currentSelected;
            }
        }

        function initTime() {
            const selectYear = document.getElementById('selectYear');
            const selectMonth = document.getElementById('selectMonth');
            const now = new Date();

            for (let y = 2024; y <= 2030; y++) {
                let opt = document.createElement('option');
                opt.value = y; opt.textContent = "Năm " + y;
                if (y === now.getFullYear()) opt.selected = true;
                selectYear.appendChild(opt);
            }

            for (let m = 1; m <= 12; m++) {
                let opt = document.createElement('option');
                opt.value = "M" + m; opt.textContent = "Tháng " + m;
                if (m === (now.getMonth() + 1)) opt.selected = true;
                selectMonth.appendChild(opt);
            }

            updateWeekDropdown();
        }

        function filterCategoryView() { loadData(); }

        function renderScrollableHeader(filter) {
            const thead = document.getElementById('scrollableHeader');
            let h1 = `<tr class="bg-excel-header text-white font-bold uppercase">`;
            let h2 = `<tr class="bg-slate-800 text-yellow-300 text-[11px] font-bold uppercase">`;

            let visibleCount = 0;
            categories.forEach((catName, idx) => {
                let catId = idx + 1;
                if (filter === "ALL" || filter == catId) {
                    visibleCount++;
                    h1 += `<th colspan="3" style="width: 225px;" class="header-row-top bg-blue-800">${catName}</th>`;
                    h2 += `<th style="width: 75px;" class="header-row-sub bg-slate-800">TỔNG</th>
                           <th style="width: 75px;" class="header-row-sub bg-slate-800">ONLINE</th>
                           <th style="width: 75px;" class="header-row-sub bg-slate-800 text-yellow-400">%</th>`;
                }
            });

            h1 += `</tr>`; h2 += `</tr>`;
            thead.innerHTML = h1 + h2;

            const scrollTable = document.getElementById('scrollableTable');
            scrollTable.style.width = (visibleCount * 225) + 'px';
        }

        function renderTables(isReadOnly = false) {
            const filter = document.getElementById('selectCategoryFilter').value;
            renderScrollableHeader(filter);

            const fixedTbody = document.getElementById('fixedTableBody');
            const scrollTbody = document.getElementById('scrollableTableBody');

            fixedTbody.innerHTML = '';
            scrollTbody.innerHTML = '';

            cmaList.forEach((cma, idx) => {
                let bgClass = idx % 2 === 0 ? 'bg-white' : 'bg-slate-50';

                // Render Bảng Cố Định Left (Đã bao gồm class text-left px-2 căn trái cột Khu Vực)
                let trFixed = document.createElement('tr');
                trFixed.className = `${bgClass} hover:bg-blue-50`;
                trFixed.innerHTML = `
                    <td style="width: 40px;" class="bg-excel-cma font-medium">${idx + 1}</td>
                    <td style="width: 100px;" class="bg-excel-cma font-bold text-left px-2 truncate">${cma}</td>
                    <td style="width: 60px;" class="font-bold text-blue-900 bg-excel-total-light row-total-all">0</td>
                    <td style="width: 60px;" class="font-bold text-emerald-800 bg-excel-total-light row-online-all">0</td>
                    <td style="width: 60px;" class="font-bold text-amber-900 bg-amber-200 border-split-right row-pct-all">0%</td>
                `;
                fixedTbody.appendChild(trFixed);

                // Render Bảng Cuộn Right
                let trScroll = document.createElement('tr');
                trScroll.className = `${bgClass} hover:bg-blue-50`;
                let htmlScroll = '';

                categories.forEach((_, cIdx) => {
                    let c = cIdx + 1;
                    if (filter === "ALL" || filter == c) {
                        if (isReadOnly) {
                            htmlScroll += `
                                <td style="width: 75px;" class="font-semibold cat-tot-${c}">0</td>
                                <td style="width: 75px;" class="font-semibold text-emerald-700 cat-on-${c}">0</td>
                                <td style="width: 75px;" class="font-bold text-blue-700 cat-pct-${c}">0%</td>
                            `;
                        } else {
                            htmlScroll += `
                                <td style="width: 75px;"><input type="number" step="1" min="0" pattern="\\d*" onkeydown="return isIntegerKey(event)" oninput="cleanIntegerInput(this)" class="tot-${c}" value="0" onfocus="this.select()" onchange="calculateRow(this)"></td>
                                <td style="width: 75px;"><input type="number" step="1" min="0" pattern="\\d*" onkeydown="return isIntegerKey(event)" oninput="cleanIntegerInput(this)" class="on-${c} text-emerald-700 font-medium" value="0" onfocus="this.select()" onchange="calculateRow(this)"></td>
                                <td style="width: 75px;" class="font-bold text-blue-700 pct-${c}">0%</td>
                            `;
                        }
                    }
                });

                trScroll.innerHTML = htmlScroll;
                scrollTbody.appendChild(trScroll);
            });

            renderFooters(filter);
        }

        function renderFooters(filter) {
            document.getElementById('fixedTableFoot').innerHTML = `
                <tr class="bg-excel-foot font-bold">
                    <td style="width: 40px;" class="p-1 text-center bg-slate-950 text-white">--</td>
                    <td style="width: 100px;" class="p-1 text-left px-2 bg-slate-950 text-white">HueWACO</td>
                    <td style="width: 60px;" id="footTotalAll" class="p-1 bg-amber-600 text-white">0</td>
                    <td style="width: 60px;" id="footOnlineAll" class="p-1 bg-amber-600 text-white">0</td>
                    <td style="width: 60px;" id="footPctAll" class="p-1 bg-amber-700 text-white border-split-right">0%</td>
                </tr>
            `;

            let htmlFoot = `<tr class="bg-excel-foot font-bold">`;
            categories.forEach((_, cIdx) => {
                let c = cIdx + 1;
                if (filter === "ALL" || filter == c) {
                    htmlFoot += `
                        <td style="width: 75px;" id="footCatTot-${c}" class="p-1 text-slate-800 bg-slate-200">0</td>
                        <td style="width: 75px;" id="footCatOn-${c}" class="p-1 text-emerald-800 bg-slate-200">0</td>
                        <td style="width: 75px;" id="footCatPct-${c}" class="p-1 text-blue-900 bg-slate-200">0%</td>
                    `;
                }
            });
            htmlFoot += `</tr>`;
            document.getElementById('scrollableTableFoot').innerHTML = htmlFoot;
        }

        function calculateRow(element) {
            let trScroll = element.closest('tr');
            let rowIndex = Array.from(trScroll.parentNode.children).indexOf(trScroll);
            let trFixed = document.querySelectorAll('#fixedTableBody tr')[rowIndex];

            let grandTotal = 0, grandOnline = 0;

            categories.forEach((_, cIdx) => {
                let c = cIdx + 1;
                let totElem = trScroll.querySelector(`.tot-${c}`);
                let onElem = trScroll.querySelector(`.on-${c}`);
                let pctElem = trScroll.querySelector(`.pct-${c}`);

                let tot = totElem ? (parseInt(totElem.value, 10) || 0) : 0;
                let on = onElem ? (parseInt(onElem.value, 10) || 0) : 0;

                if (pctElem) {
                    pctElem.textContent = tot > 0 ? Math.round((on / tot) * 100) + '%' : '0%';
                }

                grandTotal += tot;
                grandOnline += on;
            });

            trFixed.querySelector('.row-total-all').textContent = grandTotal;
            trFixed.querySelector('.row-online-all').textContent = grandOnline;
            trFixed.querySelector('.row-pct-all').textContent = grandTotal > 0 ? Math.round((grandOnline / grandTotal) * 100) + '%' : '0%';

            calculateTableTotals();
        }

        function calculateTableTotals() {
            let period = document.getElementById('selectPeriod').value;
            let filter = document.getElementById('selectCategoryFilter').value;
            let fixedRows = document.querySelectorAll('#fixedTableBody tr');
            let scrollRows = document.querySelectorAll('#scrollableTableBody tr');

            let footTotAll = 0, footOnAll = 0;
            let catTotals = Array(categories.length + 1).fill(0);
            let catOnlines = Array(categories.length + 1).fill(0);

            let isReadOnly = period === 'MONTH' || period.startsWith('Q') || period === 'YEAR';

            fixedRows.forEach((fRow, idx) => {
                let sRow = scrollRows[idx];
                footTotAll += parseInt(fRow.querySelector('.row-total-all').textContent, 10) || 0;
                footOnAll += parseInt(fRow.querySelector('.row-online-all').textContent, 10) || 0;

                categories.forEach((_, cIdx) => {
                    let c = cIdx + 1;
                    if (filter === "ALL" || filter == c) {
                        let tot = isReadOnly 
                            ? (parseInt(sRow.querySelector(`.cat-tot-${c}`)?.textContent, 10) || 0)
                            : (parseInt(sRow.querySelector(`.tot-${c}`)?.value, 10) || 0);
                        let on = isReadOnly
                            ? (parseInt(sRow.querySelector(`.cat-on-${c}`)?.textContent, 10) || 0)
                            : (parseInt(sRow.querySelector(`.on-${c}`)?.value, 10) || 0);

                        catTotals[c] += tot;
                        catOnlines[c] += on;
                    }
                });
            });

            document.getElementById('footTotalAll').textContent = footTotAll;
            document.getElementById('footOnlineAll').textContent = footOnAll;
            document.getElementById('footPctAll').textContent = footTotAll > 0 ? Math.round((footOnAll / footTotAll) * 100) + '%' : '0%';

            categories.forEach((_, cIdx) => {
                let c = cIdx + 1;
                if (filter === "ALL" || filter == c) {
                    let totCell = document.getElementById(`footCatTot-${c}`);
                    let onCell = document.getElementById(`footCatOn-${c}`);
                    let pctCell = document.getElementById(`footCatPct-${c}`);

                    if (totCell) totCell.textContent = catTotals[c];
                    if (onCell) onCell.textContent = catOnlines[c];
                    if (pctCell) pctCell.textContent = catTotals[c] > 0 ? Math.round((catOnlines[c] / catTotals[c]) * 100) + '%' : '0%';
                }
            });
        }

        function saveData() {
            let year = document.getElementById('selectYear').value;
            let month = document.getElementById('selectMonth').value;
            let period = document.getElementById('selectPeriod').value;

            if (period === 'MONTH' || period.startsWith('Q') || period === 'YEAR') {
                alert('Không thể lưu ở chế độ Tổng hợp! Vui lòng chọn tuần cụ thể.');
                return;
            }

            let key = `HUEWACO_${year}_${month}_${period}`;
            let data = [];

            document.querySelectorAll('#scrollableTableBody tr').forEach((sRow, idx) => {
                let rowData = { cma: cmaList[idx], categories: [] };
                categories.forEach((_, cIdx) => {
                    let c = cIdx + 1;
                    let totVal = sRow.querySelector(`.tot-${c}`)?.value || "0";
                    let onVal = sRow.querySelector(`.on-${c}`)?.value || "0";
                    rowData.categories.push({ tot: totVal, on: onVal });
                });
                data.push(rowData);
            });

            localStorage.setItem(key, JSON.stringify(data));
            let displayPeriod = weekNames[period] || period;
            alert(`Đã lưu thành công dữ liệu ${displayPeriod} - Tháng ${month.replace('M','')} - Năm ${year}!`);
        }

        function loadData() {
            let year = document.getElementById('selectYear').value;
            let month = document.getElementById('selectMonth').value;
            let period = document.getElementById('selectPeriod').value;
            let filter = document.getElementById('selectCategoryFilter').value;

            const btnSave = document.getElementById('btnSave');
            const notice = document.getElementById('readOnlyNotice');

            let displayPeriod = weekNames[period] || period;

            if (period === 'MONTH' || period.startsWith('Q') || period === 'YEAR') {
                btnSave.classList.add('hidden');
                notice.classList.remove('hidden');

                let monthsToAggregate = [];
                if (period === 'MONTH') {
                    monthsToAggregate = [month];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP CẢ THÁNG ${month.replace('M','')} - NĂM ${year}`;
                } else if (period === 'Q1') {
                    monthsToAggregate = ['M1', 'M2', 'M3'];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP QUÝ I - NĂM ${year}`;
                } else if (period === 'Q2') {
                    monthsToAggregate = ['M4', 'M5', 'M6'];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP QUÝ II - NĂM ${year}`;
                } else if (period === 'Q3') {
                    monthsToAggregate = ['M7', 'M8', 'M9'];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP QUÝ III - NĂM ${year}`;
                } else if (period === 'Q4') {
                    monthsToAggregate = ['M10', 'M11', 'M12'];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP QUÝ IV - NĂM ${year}`;
                } else if (period === 'YEAR') {
                    monthsToAggregate = ['M1', 'M2', 'M3', 'M4', 'M5', 'M6', 'M7', 'M8', 'M9', 'M10', 'M11', 'M12'];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP CẢ NĂM ${year}`;
                }

                renderTables(true);

                let aggregated = cmaList.map(cma => ({
                    cma: cma,
                    categories: Array.from({length: categories.length}, () => ({tot: 0, on: 0}))
                }));

                monthsToAggregate.forEach(m => {
                    ['W1','W2','W3','W4','W5'].forEach(w => {
                        let weekData = localStorage.getItem(`HUEWACO_${year}_${m}_${w}`);
                        if (weekData) {
                            let parsed = JSON.parse(weekData);
                            parsed.forEach((r, rIdx) => {
                                r.categories.forEach((cat, cIdx) => {
                                    if (aggregated[rIdx] && aggregated[rIdx].categories[cIdx]) {
                                        aggregated[rIdx].categories[cIdx].tot += parseInt(cat.tot, 10) || 0;
                                        aggregated[rIdx].categories[cIdx].on += parseInt(cat.on, 10) || 0;
                                    }
                                });
                            });
                        }
                    });
                });

                let fixedRows = document.querySelectorAll('#fixedTableBody tr');
                let scrollRows = document.querySelectorAll('#scrollableTableBody tr');

                aggregated.forEach((rData, rIdx) => {
                    let sRow = scrollRows[rIdx];
                    let fRow = fixedRows[rIdx];
                    let rTotAll = 0, rOnAll = 0;

                    rData.categories.forEach((cat, cIdx) => {
                        let c = cIdx + 1;
                        if (filter === "ALL" || filter == c) {
                            let totElem = sRow.querySelector(`.cat-tot-${c}`);
                            let onElem = sRow.querySelector(`.cat-on-${c}`);
                            let pctElem = sRow.querySelector(`.cat-pct-${c}`);

                            if (totElem) totElem.textContent = cat.tot;
                            if (onElem) onElem.textContent = cat.on;
                            if (pctElem) pctElem.textContent = cat.tot > 0 ? Math.round((cat.on / cat.tot) * 100) + '%' : '0%';
                        }
                        rTotAll += cat.tot;
                        rOnAll += cat.on;
                    });

                    fRow.querySelector('.row-total-all').textContent = rTotAll;
                    fRow.querySelector('.row-online-all').textContent = rOnAll;
                    fRow.querySelector('.row-pct-all').textContent = rTotAll > 0 ? Math.round((rOnAll / rTotAll) * 100) + '%' : '0%';
                });

                calculateTableTotals();

            } else {
                btnSave.classList.remove('hidden');
                notice.classList.add('hidden');
                document.getElementById('tableTitle').textContent = `NHẬP LIỆU ${displayPeriod.toUpperCase()} - THÁNG ${month.replace('M','')} - NĂM ${year}`;

                renderTables(false);

                let saved = localStorage.getItem(`HUEWACO_${year}_${month}_${period}`);
                if (saved) {
                    let data = JSON.parse(saved);
                    let scrollRows = document.querySelectorAll('#scrollableTableBody tr');
                    data.forEach((rData, rIdx) => {
                        let sRow = scrollRows[rIdx];
                        if (sRow) {
                            rData.categories.forEach((cat, cIdx) => {
                                let c = cIdx + 1;
                                if (sRow.querySelector(`.tot-${c}`)) sRow.querySelector(`.tot-${c}`).value = cat.tot;
                                if (sRow.querySelector(`.on-${c}`)) sRow.querySelector(`.on-${c}`).value = cat.on;
                            });
                            let firstInput = sRow.querySelector('input');
                            if (firstInput) calculateRow(firstInput);
                        }
                    });
                }
            }
        }

        initTime();
        loadData();
    </script>
</body>
</html>
