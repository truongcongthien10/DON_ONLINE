<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Tổng Hợp Đơn Online - HueWACO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }

        /* BẢNG TÍNH PHONG CÁCH EXCEL */
        .excel-table {
            width: 100%;
            border-collapse: collapse !important;
            table-layout: fixed;
            background-color: #ffffff;
            border: 1px solid #d1d5db;
        }

        .excel-table th, 
        .excel-table td {
            border: 1px solid #d1d5db; /* Viền ô xám mảnh chuẩn Excel */
            padding: 2px 1px;
            font-size: 11px;
            box-sizing: border-box;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* INPUT PHẲNG NHƯ Ô EXCEL */
        .excel-table input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            text-align: center;
            font-size: 11px;
            outline: none;
            padding: 2px 0;
            color: #1e293b;
        }

        /* HIỆU ỨNG CHỌN Ô EXCEL */
        .excel-table input:focus {
            background-color: #fef08a !important; /* Vàng nhạt Excel khi active */
            box-shadow: inset 0 0 0 2px #2563eb; /* Viền xanh khi focus */
            font-weight: bold;
        }

        .bg-excel-header { background-color: #1e3a8a; } /* Xanh đậm tiêu đề */
        .bg-excel-cma { background-color: #0f172a; color: #ffffff; } /* Dòng Khu vực */
        .bg-excel-total { background-color: #d97706; color: #ffffff; } /* Khối Tổng hợp */
        .bg-excel-total-light { background-color: #fef3c7; }
        .bg-excel-foot { background-color: #1e293b; color: #ffffff; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- Header HueWACO -->
    <header class="bg-blue-900 text-white p-3 shadow-md border-b-4 border-yellow-500">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold uppercase tracking-wide">TỔNG HỢP ĐƠN ONLINE - HUEWACO</h1>
                <p class="text-[11px] text-blue-200">Hệ thống nhập liệu & quản lý tiến độ báo cáo</p>
            </div>
            <span class="text-xs bg-yellow-500 text-blue-950 font-bold px-2.5 py-1 rounded">GitHub Pages</span>
        </div>
    </header>

    <div class="container mx-auto p-3 space-y-3">

        <!-- Thanh Bộ Lọc -->
        <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-5 gap-3 items-end">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">CHỌN NĂM:</label>
                <select id="selectYear" onchange="updateWeekDropdown(); loadData();" class="w-full border border-slate-300 rounded p-1.5 text-xs font-semibold focus:ring-2 focus:ring-blue-600">
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">CHỌN THÁNG:</label>
                <select id="selectMonth" onchange="updateWeekDropdown(); loadData();" class="w-full border border-slate-300 rounded p-1.5 text-xs font-semibold focus:ring-2 focus:ring-blue-600">
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">KỲ BÁO CÁO / NHẬP LIỆU:</label>
                <select id="selectPeriod" onchange="loadData()" class="w-full border border-slate-300 rounded p-1.5 text-xs font-bold text-blue-800 focus:ring-2 focus:ring-blue-600">
                </select>
            </div>
            <div>
                <button onclick="loadData()" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-1.5 rounded shadow-sm text-xs">
                    🔍 Xem / Tra Cứu
                </button>
            </div>
            <div>
                <button id="btnSave" onclick="saveData()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1.5 rounded shadow-sm text-xs">
                    💾 Lưu Số Liệu Tuần
                </button>
            </div>
        </div>

        <!-- Khung Bảng Dữ Liệu Chân Phương (Trọn Màn Hình) -->
        <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 overflow-hidden">
            <div class="flex justify-between items-center mb-2">
                <h2 id="tableTitle" class="text-sm font-bold text-blue-900 uppercase tracking-wide">
                    NHẬP LIỆU TUẦN 1 - THÁNG 9 - NĂM 2026
                </h2>
                <span id="readOnlyNotice" class="hidden text-[11px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded border border-amber-300">
                    🔒 Chế độ Tổng hợp Tháng (Xem tự động)
                </span>
            </div>
            
            <div class="w-full overflow-x-hidden">
                <table class="excel-table text-center">
                    <!-- Phân bổ độ rộng chính xác 100% chiều rộng -->
                    <colgroup>
                        <col style="width: 2.2%;">  <!-- STT -->
                        <col style="width: 6.8%;">  <!-- Khu vực -->
                        <col style="width: 3.1%;">  <!-- Tổng hợp TỔNG -->
                        <col style="width: 3.1%;">  <!-- Tổng hợp ONLINE -->
                        <col style="width: 2.8%;">  <!-- Tổng hợp % -->
                        <!-- 10 Dịch vụ x 3 cột (2.9%, 2.9%, 2.5%) = 83% -->
                        <script>
                            for(let i=0; i<10; i++) {
                                document.write('<col style="width: 2.9%;"><col style="width: 2.9%;"><col style="width: 2.5%;">');
                            }
                        </script>
                    </colgroup>

                    <thead class="text-white uppercase font-bold">
                        <tr class="bg-excel-header text-white">
                            <th rowspan="2" class="p-1 bg-slate-900">STT</th>
                            <th rowspan="2" class="p-1 bg-slate-900">KHU VỰC</th>
                            <th colspan="3" class="p-1 bg-amber-600 text-yellow-100">TỔNG HỢP</th>
                            <th colspan="3" class="p-1 bg-blue-800">Lắp đặt</th>
                            <th colspan="3" class="p-1 bg-blue-800">Cải tạo</th>
                            <th colspan="3" class="p-1 bg-blue-800">Nâng dời hạ</th>
                            <th colspan="3" class="p-1 bg-blue-800">Dò tìm</th>
                            <th colspan="3" class="p-1 bg-blue-800">Phụ lục</th>
                            <th colspan="3" class="p-1 bg-blue-800">Kiểm định ĐH</th>
                            <th colspan="3" class="p-1 bg-blue-800">Tạm ngừng</th>
                            <th colspan="3" class="p-1 bg-blue-800">Cắt hủy</th>
                            <th colspan="3" class="p-1 bg-blue-800">Mở nước</th>
                            <th colspan="3" class="p-1 bg-blue-800">Kiểm tra ĐH</th>
                        </tr>
                        <tr class="bg-slate-800 text-yellow-300 text-[10px]">
                            <th class="p-1 bg-amber-700">TỔNG</th>
                            <th class="p-1 bg-amber-700">ONLINE</th>
                            <th class="p-1 bg-amber-700">%</th>
                            <script>
                                for(let i=0; i<10; i++) {
                                    document.write(`
                                        <th class="p-0.5 bg-slate-800">TỔNG</th>
                                        <th class="p-0.5 bg-slate-800">ONLINE</th>
                                        <th class="p-0.5 bg-slate-800 text-yellow-400">%</th>
                                    `);
                                }
                            </script>
                        </tr>
                    </thead>
                    <tbody id="cmaTableBody">
                    </tbody>
                    <tfoot id="cmaTableFoot" class="font-bold">
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <script>
        const cmaList = ["Phú Xuân", "Thuận Hóa", "A Lưới", "Kim Long", "Hương Trà", "Phong Điền", "Hương Thủy", "Phú Vang", "Phú Lộc"];
        const totalCategories = 10;

        function padZero(num) {
            return num < 10 ? '0' + num : num;
        }

        // Tên hiển thị tuần tiếng Việt thân thiện
        const weekNames = {
            "W1": "Tuần 1",
            "W2": "Tuần 2",
            "W3": "Tuần 3",
            "W4": "Tuần 4",
            "W5": "Tuần 5"
        };

        function updateWeekDropdown() {
            const year = parseInt(document.getElementById('selectYear').value) || 2026;
            const monthStr = document.getElementById('selectMonth').value || "M9";
            const month = parseInt(monthStr.replace('M', ''));
            const selectPeriod = document.getElementById('selectPeriod');

            const currentSelectedPeriod = selectPeriod.value;
            selectPeriod.innerHTML = '';

            const daysInMonth = new Date(year, month, 0).getDate();

            const weeks = [
                { id: "W1", name: "Tuần 1", start: 1, end: 7 },
                { id: "W2", name: "Tuần 2", start: 8, end: 14 },
                { id: "W3", name: "Tuần 3", start: 15, end: 21 },
                { id: "W4", name: "Tuần 4", start: 22, end: 28 },
                { id: "W5", name: "Tuần 5", start: 29, end: daysInMonth }
            ];

            weeks.forEach(w => {
                if (w.start <= daysInMonth) {
                    let opt = document.createElement('option');
                    opt.value = w.id;
                    let endDay = Math.min(w.end, daysInMonth);
                    opt.textContent = `${w.name} (Từ ${padZero(w.start)}/${padZero(month)} đến ${padZero(endDay)}/${padZero(month)}/${year})`;
                    selectPeriod.appendChild(opt);
                }
            });

            let optMonth = document.createElement('option');
            optMonth.value = "MONTH";
            optMonth.className = "font-bold text-emerald-700";
            optMonth.textContent = `-- Tổng Hợp Cả Tháng ${month}/${year} --`;
            selectPeriod.appendChild(optMonth);

            if (currentSelectedPeriod && Array.from(selectPeriod.options).some(o => o.value === currentSelectedPeriod)) {
                selectPeriod.value = currentSelectedPeriod;
            }
        }

        function initTime() {
            const selectYear = document.getElementById('selectYear');
            const selectMonth = document.getElementById('selectMonth');
            
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;

            for (let y = 2024; y <= 2030; y++) {
                let opt = document.createElement('option');
                opt.value = y;
                opt.textContent = "Năm " + y;
                if (y === currentYear) opt.selected = true;
                selectYear.appendChild(opt);
            }

            for (let m = 1; m <= 12; m++) {
                let opt = document.createElement('option');
                opt.value = "M" + m;
                opt.textContent = "Tháng " + m;
                if (m === currentMonth) opt.selected = true;
                selectMonth.appendChild(opt);
            }

            updateWeekDropdown();
        }

        function renderTableRows(isReadOnly = false) {
            const tbody = document.getElementById('cmaTableBody');
            tbody.innerHTML = '';

            cmaList.forEach((cma, idx) => {
                let tr = document.createElement('tr');
                tr.className = idx % 2 === 0 ? 'bg-white hover:bg-blue-50' : 'bg-slate-50 hover:bg-blue-50';
                
                let html = `
                    <td class="bg-excel-cma font-medium">${idx + 1}</td>
                    <td class="bg-excel-cma font-bold text-left px-1.5">${cma}</td>
                    <td class="font-bold text-blue-900 bg-excel-total-light row-total-all">0</td>
                    <td class="font-bold text-emerald-800 bg-excel-total-light row-online-all">0</td>
                    <td class="font-bold text-amber-900 bg-amber-200 row-pct-all">0%</td>
                `;

                for (let c = 1; c <= totalCategories; c++) {
                    if (isReadOnly) {
                        html += `
                            <td class="font-semibold cat-tot-${c}">0</td>
                            <td class="font-semibold text-emerald-700 cat-on-${c}">0</td>
                            <td class="font-bold text-blue-700 cat-pct-${c}">0%</td>
                        `;
                    } else {
                        html += `
                            <td class="p-0"><input type="number" min="0" class="tot-${c}" value="0" onfocus="this.select()" onchange="calculateRow(this)"></td>
                            <td class="p-0"><input type="number" min="0" class="on-${c} text-emerald-700 font-medium" value="0" onfocus="this.select()" onchange="calculateRow(this)"></td>
                            <td class="font-bold text-blue-700 pct-${c}">0%</td>
                        `;
                    }
                }

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });

            renderFooter();
        }

        function renderFooter() {
            const tfoot = document.getElementById('cmaTableFoot');
            let html = `
                <tr class="bg-excel-foot">
                    <td class="p-1 text-center bg-slate-950 text-white">--</td>
                    <td class="p-1 text-left px-1.5 bg-slate-950 text-white">HueWACO</td>
                    <td id="footTotalAll" class="p-1 bg-amber-600 text-white">0</td>
                    <td id="footOnlineAll" class="p-1 bg-amber-600 text-white">0</td>
                    <td id="footPctAll" class="p-1 bg-amber-700 text-white">0%</td>
            `;

            for (let c = 1; c <= totalCategories; c++) {
                html += `
                    <td id="footCatTot-${c}" class="p-1 text-slate-800 bg-slate-200">0</td>
                    <td id="footCatOn-${c}" class="p-1 text-emerald-800 bg-slate-200">0</td>
                    <td id="footCatPct-${c}" class="p-1 text-blue-900 bg-slate-200">0%</td>
                `;
            }
            html += `</tr>`;
            tfoot.innerHTML = html;
        }

        function calculateRow(element) {
            let row = element.closest('tr');
            let grandTotal = 0;
            let grandOnline = 0;

            for (let c = 1; c <= totalCategories; c++) {
                let tot = parseFloat(row.querySelector(`.tot-${c}`).value) || 0;
                let on = parseFloat(row.querySelector(`.on-${c}`).value) || 0;
                let pctElem = row.querySelector(`.pct-${c}`);

                if (tot > 0) {
                    let pct = Math.round((on / tot) * 100);
                    pctElem.textContent = pct + '%';
                } else {
                    pctElem.textContent = '0%';
                }

                grandTotal += tot;
                grandOnline += on;
            }

            row.querySelector('.row-total-all').textContent = grandTotal;
            row.querySelector('.row-online-all').textContent = grandOnline;
            row.querySelector('.row-pct-all').textContent = grandTotal > 0 ? Math.round((grandOnline / grandTotal) * 100) + '%' : '0%';

            calculateTableTotals();
        }

        function calculateTableTotals() {
            let period = document.getElementById('selectPeriod').value;
            let rows = document.querySelectorAll('#cmaTableBody tr');
            
            let footTotAll = 0;
            let footOnAll = 0;
            let catTotals = Array(totalCategories + 1).fill(0);
            let catOnlines = Array(totalCategories + 1).fill(0);

            rows.forEach(row => {
                if (period === 'MONTH') {
                    footTotAll += parseFloat(row.querySelector('.row-total-all').textContent) || 0;
                    footOnAll += parseFloat(row.querySelector('.row-online-all').textContent) || 0;

                    for (let c = 1; c <= totalCategories; c++) {
                        catTotals[c] += parseFloat(row.querySelector(`.cat-tot-${c}`).textContent) || 0;
                        catOnlines[c] += parseFloat(row.querySelector(`.cat-on-${c}`).textContent) || 0;
                    }
                } else {
                    for (let c = 1; c <= totalCategories; c++) {
                        let tot = parseFloat(row.querySelector(`.tot-${c}`)?.value) || 0;
                        let on = parseFloat(row.querySelector(`.on-${c}`)?.value) || 0;
                        catTotals[c] += tot;
                        catOnlines[c] += on;
                    }
                    footTotAll += parseFloat(row.querySelector('.row-total-all').textContent) || 0;
                    footOnAll += parseFloat(row.querySelector('.row-online-all').textContent) || 0;
                }
            });

            document.getElementById('footTotalAll').textContent = footTotAll;
            document.getElementById('footOnlineAll').textContent = footOnAll;
            document.getElementById('footPctAll').textContent = footTotAll > 0 ? Math.round((footOnAll / footTotAll) * 100) + '%' : '0%';

            for (let c = 1; c <= totalCategories; c++) {
                document.getElementById(`footCatTot-${c}`).textContent = catTotals[c];
                document.getElementById(`footCatOn-${c}`).textContent = catOnlines[c];
                let pct = catTotals[c] > 0 ? Math.round((catOnlines[c] / catTotals[c]) * 100) + '%' : '0%';
                document.getElementById(`footCatPct-${c}`).textContent = pct;
            }
        }

        function saveData() {
            let year = document.getElementById('selectYear').value;
            let month = document.getElementById('selectMonth').value;
            let period = document.getElementById('selectPeriod').value;

            if (period === 'MONTH') {
                alert('Không thể lưu ở chế độ Tổng hợp Tháng! Vui lòng chọn tuần cụ thể.');
                return;
            }

            let key = `HUEWACO_${year}_${month}_${period}`;
            let data = [];

            document.querySelectorAll('#cmaTableBody tr').forEach((row, idx) => {
                let rowData = { cma: cmaList[idx], categories: [] };
                for (let c = 1; c <= totalCategories; c++) {
                    rowData.categories.push({
                        tot: row.querySelector(`.tot-${c}`).value,
                        on: row.querySelector(`.on-${c}`).value
                    });
                }
                data.push(rowData);
            });

            localStorage.setItem(key, JSON.stringify(data));
            let displayPeriodName = weekNames[period] || period;
            alert(`Đã lưu thành công dữ liệu ${displayPeriodName} - Tháng ${month.replace('M','')} - Năm ${year}!`);
        }

        function loadData() {
            let year = document.getElementById('selectYear').value;
            let month = document.getElementById('selectMonth').value;
            let period = document.getElementById('selectPeriod').value;

            const btnSave = document.getElementById('btnSave');
            const notice = document.getElementById('readOnlyNotice');

            // Đổi W1, W2... thành Tuần 1, Tuần 2... khi hiển thị tiêu đề
            let displayPeriod = weekNames[period] || period;

            if (period === 'MONTH') {
                btnSave.classList.add('hidden');
                notice.classList.remove('hidden');
                document.getElementById('tableTitle').textContent = `TỔNG HỢP CẢ THÁNG ${month.replace('M','')} - NĂM ${year}`;

                renderTableRows(true);

                let aggregated = cmaList.map(cma => ({
                    cma: cma,
                    categories: Array.from({length: totalCategories}, () => ({tot: 0, on: 0}))
                }));

                ['W1','W2','W3','W4','W5'].forEach(w => {
                    let weekData = localStorage.getItem(`HUEWACO_${year}_${month}_${w}`);
                    if (weekData) {
                        let parsed = JSON.parse(weekData);
                        parsed.forEach((r, rIdx) => {
                            r.categories.forEach((cat, cIdx) => {
                                aggregated[rIdx].categories[cIdx].tot += parseFloat(cat.tot) || 0;
                                aggregated[rIdx].categories[cIdx].on += parseFloat(cat.on) || 0;
                            });
                        });
                    }
                });

                let rows = document.querySelectorAll('#cmaTableBody tr');
                aggregated.forEach((rData, rIdx) => {
                    let row = rows[rIdx];
                    let rTotAll = 0, rOnAll = 0;

                    rData.categories.forEach((cat, cIdx) => {
                        let c = cIdx + 1;
                        row.querySelector(`.cat-tot-${c}`).textContent = cat.tot;
                        row.querySelector(`.cat-on-${c}`).textContent = cat.on;
                        let pct = cat.tot > 0 ? Math.round((cat.on / cat.tot) * 100) + '%' : '0%';
                        row.querySelector(`.cat-pct-${c}`).textContent = pct;

                        rTotAll += cat.tot;
                        rOnAll += cat.on;
                    });

                    row.querySelector('.row-total-all').textContent = rTotAll;
                    row.querySelector('.row-online-all').textContent = rOnAll;
                    row.querySelector('.row-pct-all').textContent = rTotAll > 0 ? Math.round((rOnAll / rTotAll) * 100) + '%' : '0%';
                });

                calculateTableTotals();

            } else {
                btnSave.classList.remove('hidden');
                notice.classList.add('hidden');
                document.getElementById('tableTitle').textContent = `NHẬP LIỆU ${displayPeriod.toUpperCase()} - THÁNG ${month.replace('M','')} - NĂM ${year}`;

                renderTableRows(false);

                let saved = localStorage.getItem(`HUEWACO_${year}_${month}_${period}`);
                if (saved) {
                    let data = JSON.parse(saved);
                    let rows = document.querySelectorAll('#cmaTableBody tr');
                    data.forEach((rData, rIdx) => {
                        let row = rows[rIdx];
                        if (row) {
                            rData.categories.forEach((cat, cIdx) => {
                                let c = cIdx + 1;
                                if (row.querySelector(`.tot-${c}`)) row.querySelector(`.tot-${c}`).value = cat.tot;
                                if (row.querySelector(`.on-${c}`)) row.querySelector(`.on-${c}`).value = cat.on;
                            });
                            calculateRow(row.querySelector('.tot-1'));
                        }
                    });
                }
            }
        }

        initTime();
        loadData();
    </script>
</body>
</html>
