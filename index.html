<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Tổng Hợp Đơn Online - HueWACO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box !important;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { 
            -moz-appearance: textfield; 
        }

        .excel-table {
            table-layout: fixed !important;
            border-collapse: separate !important;
            border-spacing: 0 !important;
            background-color: #ffffff;
            border-top: 1px solid #d1d5db;
        }

        .excel-table th, 
        .excel-table td {
            border-right: 1px solid #d1d5db !important;
            border-bottom: 1px solid #d1d5db !important;
            padding: 0;
            font-size: 12px;
            white-space: nowrap;
            vertical-align: middle;
            overflow: hidden;
            text-align: center;
        }

        #fixedTable {
            border-left: 1px solid #d1d5db;
        }

        .border-split-right {
            border-right: 2px solid #1e3a8a !important;
        }

        .excel-table th.h-header-top { height: 48px !important; }
        .excel-table th.h-header-sub { height: 36px !important; }
        .excel-table tr, .excel-table td { height: 28px !important; }

        .excel-table input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none !important;
            border-radius: 0 !important;
            text-align: center;
            font-size: 12px;
            outline: none;
            margin: 0;
            padding: 0;
            color: #0f172a;
        }

        .excel-table input:focus {
            background-color: #fef08a !important;
            box-shadow: inset 0 0 0 2px #2563eb !important;
            font-weight: bold;
        }

        .bg-excel-header { background-color: #1e3a8a; } 
        .bg-excel-cma { background-color: #0f172a; color: #ffffff; } 
        .bg-excel-total-light { background-color: #fef3c7; }
        .bg-excel-foot { background-color: #1e293b; color: #ffffff; }

        .scrollable-table-container::-webkit-scrollbar {
            height: 10px;
        }
        .scrollable-table-container::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .scrollable-table-container::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        .scrollable-table-container::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- Header -->
    <header class="relative bg-blue-900 text-white p-4 shadow-lg border-b-4 border-yellow-500 overflow-hidden">
        <div class="relative z-10 flex flex-col md:flex-row justify-between items-center max-w-7xl mx-auto">
            <div>
                <h1 class="text-xl font-bold uppercase tracking-wide">TỔNG HỢP ĐƠN ONLINE - HUEWACO</h1>
                <p class="text-xs text-blue-200 mt-0.5">Hệ thống nhập liệu & quản lý tiến độ báo cáo</p>
            </div>
        </div>
    </header>

    <!-- Bộ lọc & Công cụ -->
    <main class="max-w-[1600px] mx-auto p-4">
        <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 mb-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex flex-wrap items-center gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">CHỌN NĂM:</label>
                        <select id="selectYear" onchange="initWeeks(); loadData();" class="bg-slate-50 border border-slate-300 text-slate-800 text-xs rounded px-2 py-1.5 font-semibold focus:ring-blue-500 focus:border-blue-500">
                        </select>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">CHỌN THÁNG:</label>
                        <select id="selectMonth" onchange="initWeeks(); loadData();" class="bg-slate-50 border border-slate-300 text-slate-800 text-xs rounded px-2 py-1.5 font-semibold focus:ring-blue-500 focus:border-blue-500">
                        </select>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">KỲ BÁO CÁO:</label>
                        <select id="selectWeek" onchange="loadData();" class="bg-slate-50 border border-slate-300 text-slate-800 text-xs rounded px-2 py-1.5 font-semibold focus:ring-blue-500 focus:border-blue-500">
                        </select>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">HẠNG MỤC CÔNG VIỆC:</label>
                        <select id="filterCategory" onchange="renderTableHeaders(); renderTableBody();" class="bg-slate-50 border border-slate-300 text-slate-800 text-xs rounded px-2 py-1.5 font-semibold focus:ring-blue-500 focus:border-blue-500">
                            <option value="ALL">-- Hiển thị Tất Cả --</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="saveData()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs px-3 py-1.5 rounded flex items-center gap-1.5 shadow-sm transition-all">
                        💾 Lưu Số Liệu Tuần
                    </button>
                </div>
            </div>
        </div>

        <!-- Tiêu đề bảng báo cáo -->
        <div class="mb-2 flex items-center justify-between">
            <h2 id="tableTitle" class="text-sm font-bold text-blue-900 uppercase tracking-wide">
                NHẬP LIỆU
            </h2>
        </div>

        <!-- Khung hiển thị Bảng số liệu -->
        <div class="flex overflow-hidden rounded border border-slate-300 shadow-sm bg-white">
            <!-- Bảng cố định bên trái (STT & Khu Vực) -->
            <div class="flex-none z-20 bg-white">
                <table id="fixedTable" class="excel-table border-split-right">
                    <thead>
                        <tr>
                            <th class="h-header-top bg-excel-header text-white font-bold" style="width: 40px;">STT</th>
                            <th class="h-header-top bg-excel-header text-white font-bold" style="width: 120px;">KHU VỰC</th>
                        </tr>
                    </thead>
                    <tbody id="fixedTableBody">
                    </tbody>
                    <tfoot>
                        <tr>
                            <th colspan="2" class="h-header-sub bg-excel-foot font-bold text-center">HueWACO</th>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <!-- Bảng cuộn dữ liệu bên phải -->
            <div class="flex-1 overflow-x-auto scrollable-table-container">
                <table id="scrollTable" class="excel-table w-full">
                    <thead id="scrollTableHead">
                    </thead>
                    <tbody id="scrollTableBody">
                    </tbody>
                    <tfoot id="scrollTableFoot">
                    </tfoot>
                </table>
            </div>
        </div>
    </main>

    <script>
        const regions = [
            "Phú Xuân", "Thuận Hóa", "A Lưới", "Kim Long", 
            "Hương Trà", "Phong Điền", "Hương Thủy", "Phú Vang", "Phú Lộc"
        ];

        const categories = [
            "Lắp đặt", "Cải tạo", "Nâng dời hạ", "Dò tìm", 
            "Kiểm định ĐH", "Tạm ngừng", "Cắt hủy", "Mở nước", "Kiểm tra ĐH"
        ];

        let currentData = {};

        function initSelects() {
            const yearSelect = document.getElementById('selectYear');
            const currentYear = new Date().getFullYear();
            yearSelect.innerHTML = '';
            for (let y = currentYear - 2; y <= currentYear + 3; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = `Năm ${y}`;
                if (y === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            }

            const monthSelect = document.getElementById('selectMonth');
            const currentMonth = new Date().getMonth() + 1;
            monthSelect.innerHTML = '';
            for (let m = 1; m <= 12; m++) {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = `Tháng ${m}`;
                if (m === currentMonth) opt.selected = true;
                monthSelect.appendChild(opt);
            }

            const filterCat = document.getElementById('filterCategory');
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                filterCat.appendChild(opt);
            });

            initWeeks();
        }

        function initWeeks() {
            const weekSelect = document.getElementById('selectWeek');
            const year = parseInt(document.getElementById('selectYear').value);
            const month = parseInt(document.getElementById('selectMonth').value);
            
            const daysInMonth = new Date(year, month, 0).getDate();
            weekSelect.innerHTML = '';

            const ranges = [
                { week: 1, start: 1, end: 7 },
                { week: 2, start: 8, end: 14 },
                { week: 3, start: 15, end: 21 },
                { week: 4, start: 22, end: 28 },
                { week: 5, start: 29, end: daysInMonth }
            ];

            ranges.forEach(r => {
                if (r.start <= daysInMonth) {
                    const endDay = Math.min(r.end, daysInMonth);
                    const opt = document.createElement('option');
                    opt.value = `W${r.week}`;
                    opt.textContent = `Tuần ${r.week} (${String(r.start).padStart(2, '0')}/${String(month).padStart(2, '0')} đến ${String(endDay).padStart(2, '0')}/${String(month).padStart(2, '0')})`;
                    weekSelect.appendChild(opt);
                }
            });
        }

        function getActiveCategories() {
            const filter = document.getElementById('filterCategory').value;
            return filter === 'ALL' ? categories : [filter];
        }

        function renderTableHeaders() {
            const activeCats = getActiveCategories();
            const scrollHead = document.getElementById('scrollTableHead');

            let topHtml = '<tr>';
            let subHtml = '<tr>';

            // Khối Tổng hợp
            topHtml += `<th colspan="3" class="h-header-sub bg-amber-600 text-white font-bold border-split-right">TỔNG HỢP</th>`;
            subHtml += `
                <th class="h-header-sub bg-amber-500 text-white font-semibold" style="width: 55px;">TỔNG</th>
                <th class="h-header-sub bg-amber-500 text-white font-semibold" style="width: 55px;">ONLINE</th>
                <th class="h-header-sub bg-amber-500 text-white font-semibold border-split-right" style="width: 45px;">%</th>
            `;

            // Khối Hạng mục
            activeCats.forEach(cat => {
                topHtml += `<th colspan="3" class="h-header-sub bg-blue-800 text-white font-bold">${cat.toUpperCase()}</th>`;
                subHtml += `
                    <th class="h-header-sub bg-blue-900 text-slate-200 font-medium" style="width: 45px;">TỔNG</th>
                    <th class="h-header-sub bg-blue-900 text-slate-200 font-medium" style="width: 55px;">ONLINE</th>
                    <th class="h-header-sub bg-blue-900 text-slate-200 font-medium" style="width: 45px;">%</th>
                `;
            });

            topHtml += '</tr>';
            subHtml += '</tr>';

            scrollHead.innerHTML = topHtml + subHtml;
        }

        function renderTableBody() {
            const fixedBody = document.getElementById('fixedTableBody');
            const scrollBody = document.getElementById('scrollTableBody');
            const activeCats = getActiveCategories();

            let fixedHtml = '';
            let scrollHtml = '';

            regions.forEach((region, index) => {
                fixedHtml += `
                    <tr>
                        <td class="bg-excel-cma font-bold">${index + 1}</td>
                        <td class="bg-excel-cma font-bold text-left px-2 border-split-right">${region}</td>
                    </tr>
                `;

                scrollHtml += `<tr>`;
                
                // Cột Tổng hợp
                scrollHtml += `
                    <td id="sum_total_${index}" class="bg-amber-50 font-bold text-slate-800">0</td>
                    <td id="sum_online_${index}" class="bg-amber-50 font-bold text-blue-700">0</td>
                    <td id="sum_ratio_${index}" class="bg-amber-100 font-bold text-amber-800 border-split-right">0%</td>
                `;

                // Cột Nhập liệu
                activeCats.forEach(cat => {
                    const keyTotal = `${region}_${cat}_total`;
                    const keyOnline = `${region}_${cat}_online`;
                    const valTotal = currentData[keyTotal] || 0;
                    const valOnline = currentData[keyOnline] || 0;

                    scrollHtml += `
                        <td>
                            <input type="number" min="0" value="${valTotal}" 
                                   onfocus="this.select()" 
                                   oninput="updateCell('${region}', '${cat}', 'total', this.value, ${index})">
                        </td>
                        <td>
                            <input type="number" min="0" value="${valOnline}" 
                                   onfocus="this.select()" 
                                   oninput="updateCell('${region}', '${cat}', 'online', this.value, ${index})">
                        </td>
                        <td id="ratio_${index}_${cat}" class="bg-slate-50 text-slate-600 font-medium">0%</td>
                    `;
                });

                scrollHtml += `</tr>`;
            });

            fixedBody.innerHTML = fixedHtml;
            scrollBody.innerHTML = scrollHtml;

            renderTableFoot();
            recalculateAll();
        }

        function renderTableFoot() {
            const scrollFoot = document.getElementById('scrollTableFoot');
            const activeCats = getActiveCategories();

            let footHtml = '<tr>';

            footHtml += `
                <th id="foot_sum_total" class="h-header-sub bg-excel-foot text-amber-400 font-bold">0</th>
                <th id="foot_sum_online" class="h-header-sub bg-excel-foot text-amber-400 font-bold">0</th>
                <th id="foot_sum_ratio" class="h-header-sub bg-excel-foot text-amber-300 font-bold border-split-right">0%</th>
            `;

            activeCats.forEach(cat => {
                footHtml += `
                    <th id="foot_${cat}_total" class="h-header-sub bg-excel-foot text-white font-bold">0</th>
                    <th id="foot_${cat}_online" class="h-header-sub bg-excel-foot text-white font-bold">0</th>
                    <th id="foot_${cat}_ratio" class="h-header-sub bg-excel-foot text-amber-300 font-bold">0%</th>
                `;
            });

            footHtml += '</tr>';
            scrollFoot.innerHTML = footHtml;
        }

        function updateCell(region, cat, type, val, regionIdx) {
            const num = parseInt(val) || 0;
            currentData[`${region}_${cat}_${type}`] = num;
            recalculateRow(regionIdx);
            recalculateFooters();
        }

        function recalculateRow(regionIdx) {
            const region = regions[regionIdx];
            let rowTotal = 0;
            let rowOnline = 0;

            categories.forEach(cat => {
                const total = currentData[`${region}_${cat}_total`] || 0;
                const online = currentData[`${region}_${cat}_online`] || 0;

                rowTotal += total;
                rowOnline += online;

                const catRatioTd = document.getElementById(`ratio_${regionIdx}_${cat}`);
                if (catRatioTd) {
                    const ratio = total > 0 ? Math.round((online / total) * 100) : 0;
                    catRatioTd.textContent = `${ratio}%`;
                }
            });

            document.getElementById(`sum_total_${regionIdx}`).textContent = rowTotal;
            document.getElementById(`sum_online_${regionIdx}`).textContent = rowOnline;
            const rowRatio = rowTotal > 0 ? Math.round((rowOnline / rowTotal) * 100) : 0;
            document.getElementById(`sum_ratio_${regionIdx}`).textContent = `${rowRatio}%`;
        }

        function recalculateFooters() {
            let grandTotal = 0;
            let grandOnline = 0;
            const activeCats = getActiveCategories();

            activeCats.forEach(cat => {
                let catTotal = 0;
                let catOnline = 0;

                regions.forEach(region => {
                    catTotal += currentData[`${region}_${cat}_total`] || 0;
                    catOnline += currentData[`${region}_${cat}_online`] || 0;
                });

                const footCatTotal = document.getElementById(`foot_${cat}_total`);
                const footCatOnline = document.getElementById(`foot_${cat}_online`);
                const footCatRatio = document.getElementById(`foot_${cat}_ratio`);

                if (footCatTotal) footCatTotal.textContent = catTotal;
                if (footCatOnline) footCatOnline.textContent = catOnline;
                if (footCatRatio) {
                    const ratio = catTotal > 0 ? Math.round((catOnline / catTotal) * 100) : 0;
                    footCatRatio.textContent = `${ratio}%`;
                }
            });

            categories.forEach(cat => {
                regions.forEach(region => {
                    grandTotal += currentData[`${region}_${cat}_total`] || 0;
                    grandOnline += currentData[`${region}_${cat}_online`] || 0;
                });
            });

            document.getElementById(`foot_sum_total`).textContent = grandTotal;
            document.getElementById(`foot_sum_online`).textContent = grandOnline;
            const grandRatio = grandTotal > 0 ? Math.round((grandOnline / grandTotal) * 100) : 0;
            document.getElementById(`foot_sum_ratio`).textContent = `${grandRatio}%`;
        }

        function recalculateAll() {
            regions.forEach((_, idx) => recalculateRow(idx));
            recalculateFooters();
        }

        function getStorageKey() {
            const y = document.getElementById('selectYear').value;
            const m = document.getElementById('selectMonth').value;
            const w = document.getElementById('selectWeek').value;
            return `hw_data_${y}_M${m}_${w}`;
        }

        function loadData() {
            const y = document.getElementById('selectYear').value;
            const m = document.getElementById('selectMonth').value;
            const w = document.getElementById('selectWeek').value;
            
            document.getElementById('tableTitle').textContent = `NHẬP LIỆU TUẦN ${w.replace('W','')} - THÁNG ${m} - NĂM ${y}`;

            const key = getStorageKey();
            const saved = localStorage.getItem(key);
            currentData = saved ? JSON.parse(saved) : {};

            renderTableHeaders();
            renderTableBody();
        }

        function saveData() {
            const key = getStorageKey();
            localStorage.setItem(key, JSON.stringify(currentData));
            alert('Đã lưu dữ liệu báo cáo tuần thành công!');
        }

        window.onload = function() {
            initSelects();
            loadData();
        };
    </script>
</body>
</html>
