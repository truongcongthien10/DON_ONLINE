<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Tổng Hợp Đơn Online - HueWACO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }

        /* BẢNG TÍNH LƯỚI NỀN EXCEL */
        .excel-table {
            width: 100%;
            border-collapse: collapse !important;
            background-color: #ffffff;
            border: 1px solid #d1d5db;
        }

        .excel-table th, 
        .excel-table td {
            border: 1px solid #d1d5db !important;
            padding: 0;
            font-size: 12px;
            box-sizing: border-box;
            white-space: nowrap;
            height: 28px;
            vertical-align: middle;
        }

        .excel-table input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none !important;
            border-radius: 0 !important;
            text-align: center;
            font-size: 12px;
            outline: none;
            margin: 0;
            padding: 0;
            color: #0f172a;
        }

        .excel-table input:focus {
            background-color: #fef08a !important;
            box-shadow: inset 0 0 0 2px #2563eb !important;
            font-weight: bold;
        }

        .bg-excel-header { background-color: #1e3a8a; } 
        .bg-excel-cma { background-color: #0f172a; color: #ffffff; } 
        .bg-excel-total-light { background-color: #fef3c7; }
        .bg-excel-foot { background-color: #1e293b; color: #ffffff; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- Header HueWACO -->
    <header class="bg-blue-900 text-white p-3 shadow-md border-b-4 border-yellow-500">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold uppercase tracking-wide">TỔNG HỢP ĐƠN ONLINE - HUEWACO</h1>
                <p class="text-[11px] text-blue-200">Hệ thống nhập liệu & quản lý tiến độ báo cáo</p>
            </div>
            <span class="text-xs bg-yellow-500 text-blue-950 font-bold px-2.5 py-1 rounded">GitHub Pages</span>
        </div>
    </header>

    <div class="container mx-auto p-3 space-y-3">

        <!-- Thanh Bộ Lọc -->
        <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-6 gap-2.5 items-end">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">CHỌN NĂM:</label>
                <select id="selectYear" onchange="updateWeekDropdown(); loadData();" class="w-full border border-slate-300 rounded p-1.5 text-xs font-semibold focus:ring-2 focus:ring-blue-600">
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">CHỌN THÁNG:</label>
                <select id="selectMonth" onchange="updateWeekDropdown(); loadData();" class="w-full border border-slate-300 rounded p-1.5 text-xs font-semibold focus:ring-2 focus:ring-blue-600">
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">KỲ BÁO CÁO:</label>
                <select id="selectPeriod" onchange="loadData()" class="w-full border border-slate-300 rounded p-1.5 text-xs font-bold text-blue-800 focus:ring-2 focus:ring-blue-600">
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-blue-900 mb-1">HẠNG MỤC CÔNG VIỆC:</label>
                <select id="selectCategoryFilter" onchange="filterCategoryView()" class="w-full border-2 border-blue-600 rounded p-1.5 text-xs font-bold text-blue-900 bg-blue-50 focus:ring-2 focus:ring-blue-600">
                    <option value="ALL">-- Hiển thị Tất Cả --</option>
                    <option value="1">1. Lắp đặt</option>
                    <option value="2">2. Cải tạo</option>
                    <option value="3">3. Nâng dời hạ</option>
                    <option value="4">4. Dò tìm</option>
                    <option value="5">5. Kiểm định ĐH</option>
                    <option value="6">6. Tạm ngừng</option>
                    <option value="7">7. Cắt hủy</option>
                    <option value="8">8. Mở nước</option>
                    <option value="9">9. Kiểm tra ĐH</option>
                </select>
            </div>
            <div>
                <button onclick="loadData()" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-medium py-1.5 rounded shadow-sm text-xs">
                    🔍 Xem / Tra Cứu
                </button>
            </div>
            <div>
                <button id="btnSave" onclick="saveData()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1.5 rounded shadow-sm text-xs">
                    💾 Lưu Số Liệu Tuần
                </button>
            </div>
        </div>

        <!-- Khung Bảng Dữ Liệu Excel -->
        <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 overflow-x-auto">
            <div class="flex justify-between items-center mb-2">
                <h2 id="tableTitle" class="text-sm font-bold text-blue-900 uppercase tracking-wide">
                    NHẬP LIỆU TUẦN 1 - THÁNG 9 - NĂM 2026
                </h2>
                <span id="readOnlyNotice" class="hidden text-[11px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded border border-amber-300">
                    🔒 Chế độ Tổng hợp (Xem tự động)
                </span>
            </div>
            
            <table class="excel-table text-center" id="mainTable">
                <thead id="tableHead" class="text-white uppercase font-bold"></thead>
                <tbody id="cmaTableBody"></tbody>
                <tfoot id="cmaTableFoot" class="font-bold"></tfoot>
            </table>
        </div>
    </div>

    <script>
        const cmaList = ["Phú Xuân", "Thuận Hóa", "A Lưới", "Kim Long", "Hương Trà", "Phong Điền", "Hương Thủy", "Phú Vang", "Phú Lộc"];
        const categories = ["Lắp đặt", "Cải tạo", "Nâng dời hạ", "Dò tìm", "Kiểm định ĐH", "Tạm ngừng", "Cắt hủy", "Mở nước", "Kiểm tra ĐH"];

        function padZero(num) { return num < 10 ? '0' + num : num; }

        const weekNames = {
            "W1": "Tuần 1", "W2": "Tuần 2", "W3": "Tuần 3", "W4": "Tuần 4", "W5": "Tuần 5"
        };

        function updateWeekDropdown() {
            const year = parseInt(document.getElementById('selectYear').value) || 2026;
            const monthStr = document.getElementById('selectMonth').value || "M9";
            const month = parseInt(monthStr.replace('M', ''));
            const selectPeriod = document.getElementById('selectPeriod');

            const currentSelected = selectPeriod.value;
            selectPeriod.innerHTML = '';

            const daysInMonth = new Date(year, month, 0).getDate();
            const weeks = [
                { id: "W1", name: "Tuần 1", start: 1, end: 7 },
                { id: "W2", name: "Tuần 2", start: 8, end: 14 },
                { id: "W3", name: "Tuần 3", start: 15, end: 21 },
                { id: "W4", name: "Tuần 4", start: 22, end: 28 },
                { id: "W5", name: "Tuần 5", start: 29, end: daysInMonth }
            ];

            // 1. Thêm các tuần trong tháng
            weeks.forEach(w => {
                if (w.start <= daysInMonth) {
                    let opt = document.createElement('option');
                    opt.value = w.id;
                    opt.textContent = `${w.name} (${padZero(w.start)}/${padZero(month)} đến ${padZero(Math.min(w.end, daysInMonth))}/${padZero(month)})`;
                    selectPeriod.appendChild(opt);
                }
            });

            // 2. Thêm Tổng Hợp Tháng
            let optMonth = document.createElement('option');
            optMonth.value = "MONTH";
            optMonth.className = "font-bold text-emerald-700";
            optMonth.textContent = `-- Tổng Hợp Cả Tháng ${month}/${year} --`;
            selectPeriod.appendChild(optMonth);

            // 3. Thêm Tổng Hợp Các Quý
            const quarters = [
                { id: "Q1", name: "Tổng Hợp Quý I (Tháng 1 - 3)" },
                { id: "Q2", name: "Tổng Hợp Quý II (Tháng 4 - 6)" },
                { id: "Q3", name: "Tổng Hợp Quý III (Tháng 7 - 9)" },
                { id: "Q4", name: "Tổng Hợp Quý IV (Tháng 10 - 12)" }
            ];

            quarters.forEach(q => {
                let opt = document.createElement('option');
                opt.value = q.id;
                opt.className = "font-bold text-blue-700";
                opt.textContent = `-- ${q.name} --`;
                selectPeriod.appendChild(opt);
            });

            // 4. Thêm Tổng Hợp Cả Năm
            let optYear = document.createElement('option');
            optYear.value = "YEAR";
            optYear.className = "font-bold text-purple-700";
            optYear.textContent = `-- TỔNG HỢP CẢ NĂM ${year} --`;
            selectPeriod.appendChild(optYear);

            if (currentSelected && Array.from(selectPeriod.options).some(o => o.value === currentSelected)) {
                selectPeriod.value = currentSelected;
            }
        }

        function initTime() {
            const selectYear = document.getElementById('selectYear');
            const selectMonth = document.getElementById('selectMonth');
            const now = new Date();

            for (let y = 2024; y <= 2030; y++) {
                let opt = document.createElement('option');
                opt.value = y; opt.textContent = "Năm " + y;
                if (y === now.getFullYear()) opt.selected = true;
                selectYear.appendChild(opt);
            }

            for (let m = 1; m <= 12; m++) {
                let opt = document.createElement('option');
                opt.value = "M" + m; opt.textContent = "Tháng " + m;
                if (m === (now.getMonth() + 1)) opt.selected = true;
                selectMonth.appendChild(opt);
            }

            updateWeekDropdown();
        }

        function filterCategoryView() {
            loadData();
        }

        function renderTableHeader(filter) {
            const thead = document.getElementById('tableHead');
            let h1 = `<tr class="bg-excel-header">
                <th rowspan="2" class="p-1 bg-slate-900 w-10">STT</th>
                <th rowspan="2" class="p-1 bg-slate-900 w-32">KHU VỰC</th>
                <th colspan="3" class="p-1 bg-amber-600 text-yellow-100">TỔNG HỢP</th>`;
            
            let h2 = `<tr class="bg-slate-800 text-yellow-300 text-[11px]">
                <th class="p-1 bg-amber-700 w-12">TỔNG</th>
                <th class="p-1 bg-amber-700 w-12">ONLINE</th>
                <th class="p-1 bg-amber-700 w-10">%</th>`;

            categories.forEach((catName, idx) => {
                let catId = idx + 1;
                if (filter === "ALL" || filter == catId) {
                    h1 += `<th colspan="3" class="p-1 bg-blue-800">${catName}</th>`;
                    h2 += `<th class="p-1 bg-slate-800">TỔNG</th><th class="p-1 bg-slate-800">ONLINE</th><th class="p-1 bg-slate-800 text-yellow-400">%</th>`;
                }
            });

            h1 += `</tr>`; h2 += `</tr>`;
            thead.innerHTML = h1 + h2;
        }

        function renderTableRows(isReadOnly = false) {
            const filter = document.getElementById('selectCategoryFilter').value;
            renderTableHeader(filter);

            const tbody = document.getElementById('cmaTableBody');
            tbody.innerHTML = '';

            cmaList.forEach((cma, idx) => {
                let tr = document.createElement('tr');
                tr.className = idx % 2 === 0 ? 'bg-white hover:bg-blue-50' : 'bg-slate-50 hover:bg-blue-50';
                
                let html = `
                    <td class="bg-excel-cma font-medium">${idx + 1}</td>
                    <td class="bg-excel-cma font-bold text-left px-2">${cma}</td>
                    <td class="font-bold text-blue-900 bg-excel-total-light row-total-all">0</td>
                    <td class="font-bold text-emerald-800 bg-excel-total-light row-online-all">0</td>
                    <td class="font-bold text-amber-900 bg-amber-200 row-pct-all">0%</td>
                `;

                categories.forEach((_, cIdx) => {
                    let c = cIdx + 1;
                    if (filter === "ALL" || filter == c) {
                        if (isReadOnly) {
                            html += `
                                <td class="font-semibold cat-tot-${c}">0</td>
                                <td class="font-semibold text-emerald-700 cat-on-${c}">0</td>
                                <td class="font-bold text-blue-700 cat-pct-${c}">0%</td>
                            `;
                        } else {
                            html += `
                                <td><input type="number" min="0" class="tot-${c}" value="0" onfocus="this.select()" onchange="calculateRow(this)"></td>
                                <td><input type="number" min="0" class="on-${c} text-emerald-700 font-medium" value="0" onfocus="this.select()" onchange="calculateRow(this)"></td>
                                <td class="font-bold text-blue-700 pct-${c}">0%</td>
                            `;
                        }
                    }
                });

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });

            renderFooter(filter);
        }

        function renderFooter(filter) {
            const tfoot = document.getElementById('cmaTableFoot');
            let html = `
                <tr class="bg-excel-foot">
                    <td class="p-1 text-center bg-slate-950 text-white">--</td>
                    <td class="p-1 text-left px-2 bg-slate-950 text-white">HueWACO</td>
                    <td id="footTotalAll" class="p-1 bg-amber-600 text-white">0</td>
                    <td id="footOnlineAll" class="p-1 bg-amber-600 text-white">0</td>
                    <td id="footPctAll" class="p-1 bg-amber-700 text-white">0%</td>
            `;

            categories.forEach((_, cIdx) => {
                let c = cIdx + 1;
                if (filter === "ALL" || filter == c) {
                    html += `
                        <td id="footCatTot-${c}" class="p-1 text-slate-800 bg-slate-200">0</td>
                        <td id="footCatOn-${c}" class="p-1 text-emerald-800 bg-slate-200">0</td>
                        <td id="footCatPct-${c}" class="p-1 text-blue-900 bg-slate-200">0%</td>
                    `;
                }
            });
            html += `</tr>`;
            tfoot.innerHTML = html;
        }

        function calculateRow(element) {
            let row = element.closest('tr');
            let grandTotal = 0, grandOnline = 0;

            categories.forEach((_, cIdx) => {
                let c = cIdx + 1;
                let totElem = row.querySelector(`.tot-${c}`);
                let onElem = row.querySelector(`.on-${c}`);
                let pctElem = row.querySelector(`.pct-${c}`);

                let tot = totElem ? (parseFloat(totElem.value) || 0) : 0;
                let on = onElem ? (parseFloat(onElem.value) || 0) : 0;

                if (pctElem) {
                    pctElem.textContent = tot > 0 ? Math.round((on / tot) * 100) + '%' : '0%';
                }

                grandTotal += tot;
                grandOnline += on;
            });

            row.querySelector('.row-total-all').textContent = grandTotal;
            row.querySelector('.row-online-all').textContent = grandOnline;
            row.querySelector('.row-pct-all').textContent = grandTotal > 0 ? Math.round((grandOnline / grandTotal) * 100) + '%' : '0%';

            calculateTableTotals();
        }

        function calculateTableTotals() {
            let period = document.getElementById('selectPeriod').value;
            let filter = document.getElementById('selectCategoryFilter').value;
            let rows = document.querySelectorAll('#cmaTableBody tr');
            
            let footTotAll = 0, footOnAll = 0;
            let catTotals = Array(categories.length + 1).fill(0);
            let catOnlines = Array(categories.length + 1).fill(0);

            let isReadOnly = period === 'MONTH' || period.startsWith('Q') || period === 'YEAR';

            rows.forEach(row => {
                footTotAll += parseFloat(row.querySelector('.row-total-all').textContent) || 0;
                footOnAll += parseFloat(row.querySelector('.row-online-all').textContent) || 0;

                categories.forEach((_, cIdx) => {
                    let c = cIdx + 1;
                    if (filter === "ALL" || filter == c) {
                        let tot = isReadOnly 
                            ? (parseFloat(row.querySelector(`.cat-tot-${c}`)?.textContent) || 0)
                            : (parseFloat(row.querySelector(`.tot-${c}`)?.value) || 0);
                        let on = isReadOnly
                            ? (parseFloat(row.querySelector(`.cat-on-${c}`)?.textContent) || 0)
                            : (parseFloat(row.querySelector(`.on-${c}`)?.value) || 0);

                        catTotals[c] += tot;
                        catOnlines[c] += on;
                    }
                });
            });

            document.getElementById('footTotalAll').textContent = footTotAll;
            document.getElementById('footOnlineAll').textContent = footOnAll;
            document.getElementById('footPctAll').textContent = footTotAll > 0 ? Math.round((footOnAll / footTotAll) * 100) + '%' : '0%';

            categories.forEach((_, cIdx) => {
                let c = cIdx + 1;
                if (filter === "ALL" || filter == c) {
                    let totCell = document.getElementById(`footCatTot-${c}`);
                    let onCell = document.getElementById(`footCatOn-${c}`);
                    let pctCell = document.getElementById(`footCatPct-${c}`);

                    if (totCell) totCell.textContent = catTotals[c];
                    if (onCell) onCell.textContent = catOnlines[c];
                    if (pctCell) pctCell.textContent = catTotals[c] > 0 ? Math.round((catOnlines[c] / catTotals[c]) * 100) + '%' : '0%';
                }
            });
        }

        function saveData() {
            let year = document.getElementById('selectYear').value;
            let month = document.getElementById('selectMonth').value;
            let period = document.getElementById('selectPeriod').value;

            if (period === 'MONTH' || period.startsWith('Q') || period === 'YEAR') {
                alert('Không thể lưu ở chế độ Tổng hợp! Vui lòng chọn tuần cụ thể.');
                return;
            }

            let key = `HUEWACO_${year}_${month}_${period}`;
            let data = [];

            document.querySelectorAll('#cmaTableBody tr').forEach((row, idx) => {
                let rowData = { cma: cmaList[idx], categories: [] };
                categories.forEach((_, cIdx) => {
                    let c = cIdx + 1;
                    let totVal = row.querySelector(`.tot-${c}`)?.value || "0";
                    let onVal = row.querySelector(`.on-${c}`)?.value || "0";
                    rowData.categories.push({ tot: totVal, on: onVal });
                });
                data.push(rowData);
            });

            localStorage.setItem(key, JSON.stringify(data));
            let displayPeriod = weekNames[period] || period;
            alert(`Đã lưu thành công dữ liệu ${displayPeriod} - Tháng ${month.replace('M','')} - Năm ${year}!`);
        }

        function loadData() {
            let year = document.getElementById('selectYear').value;
            let month = document.getElementById('selectMonth').value;
            let period = document.getElementById('selectPeriod').value;
            let filter = document.getElementById('selectCategoryFilter').value;

            const btnSave = document.getElementById('btnSave');
            const notice = document.getElementById('readOnlyNotice');

            let displayPeriod = weekNames[period] || period;

            // Xử lý chế độ TỔNG HỢP (Tháng / Quý / Năm)
            if (period === 'MONTH' || period.startsWith('Q') || period === 'YEAR') {
                btnSave.classList.add('hidden');
                notice.classList.remove('hidden');

                // Xác định danh sách các tháng cần tổng hợp
                let monthsToAggregate = [];
                if (period === 'MONTH') {
                    monthsToAggregate = [month];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP CẢ THÁNG ${month.replace('M','')} - NĂM ${year}`;
                } else if (period === 'Q1') {
                    monthsToAggregate = ['M1', 'M2', 'M3'];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP QUÝ I - NĂM ${year}`;
                } else if (period === 'Q2') {
                    monthsToAggregate = ['M4', 'M5', 'M6'];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP QUÝ II - NĂM ${year}`;
                } else if (period === 'Q3') {
                    monthsToAggregate = ['M7', 'M8', 'M9'];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP QUÝ III - NĂM ${year}`;
                } else if (period === 'Q4') {
                    monthsToAggregate = ['M10', 'M11', 'M12'];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP QUÝ IV - NĂM ${year}`;
                } else if (period === 'YEAR') {
                    monthsToAggregate = ['M1', 'M2', 'M3', 'M4', 'M5', 'M6', 'M7', 'M8', 'M9', 'M10', 'M11', 'M12'];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP CẢ NĂM ${year}`;
                }

                renderTableRows(true);

                let aggregated = cmaList.map(cma => ({
                    cma: cma,
                    categories: Array.from({length: categories.length}, () => ({tot: 0, on: 0}))
                }));

                // Cộng dồn dữ liệu của tất cả các tuần trong các tháng chỉ định
                monthsToAggregate.forEach(m => {
                    ['W1','W2','W3','W4','W5'].forEach(w => {
                        let weekData = localStorage.getItem(`HUEWACO_${year}_${m}_${w}`);
                        if (weekData) {
                            let parsed = JSON.parse(weekData);
                            parsed.forEach((r, rIdx) => {
                                r.categories.forEach((cat, cIdx) => {
                                    if (aggregated[rIdx] && aggregated[rIdx].categories[cIdx]) {
                                        aggregated[rIdx].categories[cIdx].tot += parseFloat(cat.tot) || 0;
                                        aggregated[rIdx].categories[cIdx].on += parseFloat(cat.on) || 0;
                                    }
                                });
                            });
                        }
                    });
                });

                let rows = document.querySelectorAll('#cmaTableBody tr');
                aggregated.forEach((rData, rIdx) => {
                    let row = rows[rIdx];
                    let rTotAll = 0, rOnAll = 0;

                    rData.categories.forEach((cat, cIdx) => {
                        let c = cIdx + 1;
                        if (filter === "ALL" || filter == c) {
                            let totElem = row.querySelector(`.cat-tot-${c}`);
                            let onElem = row.querySelector(`.cat-on-${c}`);
                            let pctElem = row.querySelector(`.cat-pct-${c}`);

                            if (totElem) totElem.textContent = cat.tot;
                            if (onElem) onElem.textContent = cat.on;
                            if (pctElem) pctElem.textContent = cat.tot > 0 ? Math.round((cat.on / cat.tot) * 100) + '%' : '0%';
                        }
                        rTotAll += cat.tot;
                        rOnAll += cat.on;
                    });

                    row.querySelector('.row-total-all').textContent = rTotAll;
                    row.querySelector('.row-online-all').textContent = rOnAll;
                    row.querySelector('.row-pct-all').textContent = rTotAll > 0 ? Math.round((rOnAll / rTotAll) * 100) + '%' : '0%';
                });

                calculateTableTotals();

            } else {
                // Chế độ Nhập liệu Tuần
                btnSave.classList.remove('hidden');
                notice.classList.add('hidden');
                document.getElementById('tableTitle').textContent = `NHẬP LIỆU ${displayPeriod.toUpperCase()} - THÁNG ${month.replace('M','')} - NĂM ${year}`;

                renderTableRows(false);

                let saved = localStorage.getItem(`HUEWACO_${year}_${month}_${period}`);
                if (saved) {
                    let data = JSON.parse(saved);
                    let rows = document.querySelectorAll('#cmaTableBody tr');
                    data.forEach((rData, rIdx) => {
                        let row = rows[rIdx];
                        if (row) {
                            rData.categories.forEach((cat, cIdx) => {
                                let c = cIdx + 1;
                                if (row.querySelector(`.tot-${c}`)) row.querySelector(`.tot-${c}`).value = cat.tot;
                                if (row.querySelector(`.on-${c}`)) row.querySelector(`.on-${c}`).value = cat.on;
                            });
                            calculateRow(row.querySelector('input'));
                        }
                    });
                }
            }
        }

        initTime();
        loadData();
    </script>
</body>
</html>
