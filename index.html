<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Tổng Hợp Đơn Online - HueWACO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <style>
        * { box-sizing: border-box !important; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }

        .excel-table {
            table-layout: fixed !important;
            border-collapse: separate !important;
            border-spacing: 0 !important;
            background-color: #ffffff;
            border-top: 1px solid #d1d5db;
        }

        .excel-table th, .excel-table td {
            border-right: 1px solid #d1d5db !important;
            border-bottom: 1px solid #d1d5db !important;
            padding: 0;
            font-size: 12px;
            white-space: nowrap;
            vertical-align: middle;
            overflow: hidden;
            text-align: center;
        }

        #fixedTable { border-left: 1px solid #d1d5db; }
        .border-split-right { border-right: 2px solid #1e3a8a !important; }

        .excel-table th.h-header-top { height: 48px !important; }
        .excel-table th.h-header-sub { height: 36px !important; }
        .excel-table tr, .excel-table td { height: 28px !important; }

        .excel-table input {
            width: 100%; height: 100%;
            background: transparent;
            border: none !important;
            border-radius: 0 !important;
            text-align: center;
            font-size: 12px;
            outline: none; margin: 0; padding: 0;
            color: #0f172a;
        }

        .excel-table input:focus {
            background-color: #fef08a !important;
            box-shadow: inset 0 0 0 2px #2563eb !important;
            font-weight: bold;
        }

        .bg-excel-header { background-color: #1e3a8a; } 
        .bg-excel-cma { background-color: #0f172a; color: #ffffff; } 
        .bg-excel-total-light { background-color: #fef3c7; }
        .bg-excel-foot { background-color: #1e293b; color: #ffffff; }

        .scrollable-table-container::-webkit-scrollbar { height: 10px; }
        .scrollable-table-container::-webkit-scrollbar-track { background: #f1f5f9; }
        .scrollable-table-container::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .scrollable-table-container::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* CSS Ẩn/Hiện cột TỔNG HỢP linh hoạt trên điện thoại */
        @media (max-width: 767px) {
            body.hide-summary #fixedTable th:nth-child(3),
            body.hide-summary #fixedTable tr:nth-child(2) th:nth-child(1),
            body.hide-summary #fixedTable tr:nth-child(2) th:nth-child(2),
            body.hide-summary #fixedTable tr:nth-child(2) th:nth-child(3),
            body.hide-summary #fixedTable td:nth-child(3),
            body.hide-summary #fixedTable td:nth-child(4),
            body.hide-summary #fixedTable td:nth-child(5) {
                display: none !important;
            }
        }

        /* Khóa chiều rộng bảng cố định đúng 150px khi Ẩn TH */
        body.hide-summary #fixedTable {
            width: 150px !important;
            min-width: 150px !important;
            max-width: 150px !important;
        }

        /* Cố định kích thước cột Khu Vực */
        #fixedTable th:nth-child(2),
        #fixedTable td:nth-child(2) {
            width: 110px !important;
            min-width: 110px !important;
            max-width: 110px !important;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Đồng bộ độ cao hàng tiêu đề */
        #fixedTable thead tr:first-child th,
        #scrollableTable thead tr:first-child th {
            height: 36px !important;
            vertical-align: middle !important;
        }

        #fixedTable thead tr:nth-child(2) th,
        #scrollableTable thead tr:nth-child(2) th {
            height: 28px !important;
            vertical-align: middle !important;
        }
    </style>
</head>

    <div class="container mx-auto p-3 space-y-3">

        <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 space-y-3">
            <!-- Hàng 1: Các bộ lọc kéo sát về bên trái nối tiếp nhau + Thông tin User ở góc phải -->
            <div class="flex flex-wrap items-end justify-start gap-2 pb-2 border-b border-gray-100">
                <div class="w-28 sm:w-32">
                    <label class="block text-xs font-bold text-slate-700 mb-1">CHỌN NĂM:</label>
                    <select id="selectYear" onchange="updateWeekDropdown(); loadData();" class="w-full bg-gray-100 border border-slate-300 rounded p-1.5 text-xs font-semibold focus:ring-2 focus:ring-blue-600">
                        <option value="2026">Năm 2026</option>
                    </select>
                </div>
                <div class="w-28 sm:w-32">
                    <label class="block text-xs font-bold text-slate-700 mb-1">CHỌN THÁNG:</label>
                    <select id="selectMonth" onchange="updateWeekDropdown(); loadData();" class="w-full bg-gray-100 border border-slate-300 rounded p-1.5 text-xs font-semibold focus:ring-2 focus:ring-blue-600">
                        <option value="M9">Tháng 9</option>
                    </select>
                </div>
                <div class="w-48 sm:w-56">
                    <label class="block text-xs font-bold text-slate-700 mb-1">KỲ BÁO CÁO:</label>

                        <option value="36">Tuần 36 (31/08 đến 06/09)</option>
                    </select>
                </div>

        function updateWeekDropdown() {

        function saveDataSilent() {
            let year = document.getElementById('selectYear').value;
            let period = document.getElementById('selectPeriod').value;

            if (period === 'MONTH' || period.startsWith('Q') || period === 'YEAR') return;

            let key = `HUEWACO_${year}_${period}`;
            let existingData = localStorage.getItem(key);
            let data = existingData ? JSON.parse(existingData) : cmaList.map(cma => ({
                cma: cma,
                categories: Array.from({length: categories.length}, () => ({tot: "0", on: "0"}))
            }));

            let scrollRows = document.querySelectorAll('#scrollableTableBody tr');
            let filter = document.getElementById('selectCategoryFilter').value;

            cmaList.forEach((cma, idx) => {
                let row = scrollRows[idx];
                if (!row) return;

                categories.forEach((_, cIdx) => {
                    let c = cIdx + 1;
                    if (filter === "ALL" || filter == c) {
                        let totVal = row.querySelector(`.tot-${c}`)?.value || "0";
                        let onVal = row.querySelector(`.on-${c}`)?.value || "0";

                        if (!data[idx].categories[cIdx]) {
                            data[idx].categories[cIdx] = {};
                        }
                        data[idx].categories[cIdx].tot = totVal;
                        data[idx].categories[cIdx].on = onVal;
                    }
                });
            });

            localStorage.setItem(key, JSON.stringify(data));
        }

                                <td style="width: 75px;"><input type="number" step="1" min="0" pattern="\\d*" onkeydown="return isIntegerKey(event)" oninput="cleanIntegerInput(this)" class="tot-${c}" value="0" onfocus="this.select()" onchange="calculateRow(${idx}, this)"></td>
                                <td style="width: 75px;"><input type="number" step="1" min="0" pattern="\\d*" onkeydown="return isIntegerKey(event)" oninput="cleanIntegerInput(this)" class="on-${c} text-emerald-700 font-medium" value="0" onfocus="this.select()" onchange="calculateRow(${idx}, this)"></td>

        function applyDataToTable(data) {
            if (!data || !Array.isArray(data)) return;
            let scrollRows = document.querySelectorAll('#scrollableTableBody tr');
            let filter = document.getElementById('selectCategoryFilter').value;

            data.forEach((rData, rIdx) => {
                let scrollRow = scrollRows[rIdx];
                if (!scrollRow) return;

                if (rData.categories && Array.isArray(rData.categories)) {
                    rData.categories.forEach((cat, cIdx) => {
                        let c = cIdx + 1;
                        if (filter === "ALL" || filter == c) {
                            let totInput = scrollRow.querySelector(`.tot-${c}`);
                            let onInput = scrollRow.querySelector(`.on-${c}`);
                            if (totInput) totInput.value = cat.tot || "0";
                            if (onInput) onInput.value = cat.on || "0";
                        }
                    });
                }
                calculateRow(rIdx, null);
            });
        }

        function calculateRow(rowIndex, element) {
            let fixedRow = document.querySelectorAll('#fixedTableBody tr')[rowIndex];
            let scrollRow = document.querySelectorAll('#scrollableTableBody tr')[rowIndex];

            if (!fixedRow || !scrollRow) return;

            let grandTotal = 0, grandOnline = 0;

            categories.forEach((_, cIdx) => {
                let c = cIdx + 1;
                let totElem = scrollRow.querySelector(`.tot-${c}`);
                let onElem = scrollRow.querySelector(`.on-${c}`);
                let pctElem = scrollRow.querySelector(`.pct-${c}`);

                let tot = totElem ? (parseInt(totElem.value, 10) || 0) : 0;
                let on = onElem ? (parseInt(onElem.value, 10) || 0) : 0;

                if (pctElem) {
                    pctElem.textContent = tot > 0 ? Math.round((on / tot) * 100) + '%' : '0%';
                }

                grandTotal += tot;
                grandOnline += on;
            });

            fixedRow.querySelector('.row-total-all').textContent = grandTotal;
            fixedRow.querySelector('.row-online-all').textContent = grandOnline;
            fixedRow.querySelector('.row-pct-all').textContent = grandTotal > 0 ? Math.round((grandOnline / grandTotal) * 100) + '%' : '0%';

            calculateTableTotals();
            saveDataSilent();
        }

        function calculateTableTotals() {
            let period = document.getElementById('selectPeriod').value;
            let filter = document.getElementById('selectCategoryFilter').value;
            let fixedRows = document.querySelectorAll('#fixedTableBody tr');
            let scrollRows = document.querySelectorAll('#scrollableTableBody tr');

            let footTotAll = 0, footOnAll = 0;
            let catTotals = Array(categories.length + 1).fill(0);
            let catOnlines = Array(categories.length + 1).fill(0);

            let isReadOnly = period === 'MONTH' || period.startsWith('Q') || period === 'YEAR';

            fixedRows.forEach((fixedRow, idx) => {
                let scrollRow = scrollRows[idx];

                footTotAll += parseInt(fixedRow.querySelector('.row-total-all').textContent, 10) || 0;
                footOnAll += parseInt(fixedRow.querySelector('.row-online-all').textContent, 10) || 0;

                categories.forEach((_, cIdx) => {
                    let c = cIdx + 1;
                    if (filter === "ALL" || filter == c) {
                        let tot = isReadOnly 
                            ? (parseInt(scrollRow.querySelector(`.cat-tot-${c}`)?.textContent, 10) || 0)
                            : (parseInt(scrollRow.querySelector(`.tot-${c}`)?.value, 10) || 0);
                        let on = isReadOnly
                            ? (parseInt(scrollRow.querySelector(`.cat-on-${c}`)?.textContent, 10) || 0)
                            : (parseInt(scrollRow.querySelector(`.on-${c}`)?.value, 10) || 0);

                        catTotals[c] += tot;
                        catOnlines[c] += on;
                    }
                });
            });

            document.getElementById('footTotalAll').textContent = footTotAll;
            document.getElementById('footOnlineAll').textContent = footOnAll;
            document.getElementById('footPctAll').textContent = footTotAll > 0 ? Math.round((footOnAll / footTotAll) * 100) + '%' : '0%';

            categories.forEach((_, cIdx) => {
                let c = cIdx + 1;
                if (filter === "ALL" || filter == c) {
                    let totCell = document.getElementById(`footCatTot-${c}`);
                    let onCell = document.getElementById(`footCatOn-${c}`);
                    let pctCell = document.getElementById(`footCatPct-${c}`);

                    if (totCell) totCell.textContent = catTotals[c];
                    if (onCell) onCell.textContent = catOnlines[c];
                    if (pctCell) pctCell.textContent = catTotals[c] > 0 ? Math.round((catOnlines[c] / catTotals[c]) * 100) + '%' : '0%';
                }
            });
        }

        window.toggleSummaryColumn = function() {
            document.body.classList.toggle('hide-summary');

        function saveData() {
            if (typeof GOOGLE_SCRIPT_URL === 'undefined' || !GOOGLE_SCRIPT_URL) {
                showAlert("Chưa cấu hình Google Script URL!");
                return;
            }

            let yearElem = document.getElementById('selectYear');
            let year = (yearElem && yearElem.value) ? yearElem.value : "2026";
            let period = document.getElementById('selectPeriod').value;
            
            if (period === 'MONTH' || period.startsWith('Q') || period === 'YEAR') {
                showAlert('Không thể lưu ở chế độ Tổng hợp! Vui lòng chọn tuần cụ thể.');
                return;
            }

            let cleanPeriod = period.replace(/^WEEK_/, '');
            let primaryKey = `HUEWACO_${year}_WEEK_${cleanPeriod}`;

            let existingData = localStorage.getItem(primaryKey);
            let data = existingData ? JSON.parse(existingData) : cmaList.map(cma => ({
                cma: cma,
                categories: Array.from({length: categories.length}, () => ({tot: "0", on: "0"}))
            }));

            let scrollRows = document.querySelectorAll('#scrollableTableBody tr');
            let filter = document.getElementById('selectCategoryFilter').value;

            cmaList.forEach((cma, idx) => {
                let row = scrollRows[idx];
                if (!row) return;

                categories.forEach((_, cIdx) => {
                    let c = cIdx + 1;
                    if (filter === "ALL" || filter == c) {
                        let totInput = row.querySelector(`.tot-${c}`);
                        let onInput = row.querySelector(`.on-${c}`);

                        let totVal = totInput ? totInput.value : "0";
                        let onVal = onInput ? onInput.value : "0";

                        if (!data[idx].categories[cIdx]) {
                            data[idx].categories[cIdx] = {};
                        }
                        data[idx].categories[cIdx].tot = totVal;
                        data[idx].categories[cIdx].on = onVal;
                    }
                });
            });

            let btnSave = document.getElementById('btnSave');
            let originalText = btnSave ? btnSave.innerHTML : "";
            if (btnSave) {
                btnSave.disabled = true;
                btnSave.innerHTML = "⏳ Đang lưu...";
            }

            if (cloudCache) cloudCache[primaryKey] = data;
            localStorage.setItem(primaryKey, JSON.stringify(data));

            let payloadData = new URLSearchParams();
            payloadData.append("key", primaryKey);
            payloadData.append("value", JSON.stringify(data));

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: payloadData
            })
            .then(() => {
                showAlert(`✅ Đã ghi thành công dữ liệu Tuần ${cleanPeriod} lên Google Sheet!`);
            })
            .catch(err => {
                console.error("Lỗi lưu Cloud:", err);
                showAlert("⚠️ Đã lưu tạm vào máy! Kiểm tra lại kết nối Cloud.");
            })
            .finally(() => {
                if (btnSave) {
                    btnSave.disabled = false;
                    btnSave.innerHTML = originalText;
                }
            });
        }

        let cloudCache = null;

        function preloadAllCloudData(callback) {
            if (typeof GOOGLE_SCRIPT_URL === 'undefined' || !GOOGLE_SCRIPT_URL) {
                if (callback) callback();
                return;
            }
            
            let cacheBuster = Date.now() + "_" + Math.floor(Math.random() * 1000000);
            
            fetch(`${GOOGLE_SCRIPT_URL}?all=true&_t=${cacheBuster}`, {
                method: 'GET',
                cache: 'no-store'
            })
                .then(res => res.json())
                .then(data => {
                    if (data && typeof data === 'object' && Object.keys(data).length > 0) {
                        cloudCache = data;
                        Object.keys(data).forEach(k => {
                            localStorage.setItem(k, JSON.stringify(data[k]));
                        });
                    }
                    if (callback) callback();
                })
                .catch(err => {
                    console.log("Lỗi tải Cloud:", err);
                    if (callback) callback();
                });
        }

        function loadData() {
            let yearElem = document.getElementById('selectYear');
            let year = (yearElem && yearElem.value) ? yearElem.value : "2026";
            
            let month = document.getElementById('selectMonth').value;
            let period = document.getElementById('selectPeriod').value;
            let filter = document.getElementById('selectCategoryFilter').value;

            let primaryKey = `HUEWACO_${year}_WEEK_${period}`;

            const btnSave = document.getElementById('btnSave');
            const notice = document.getElementById('readOnlyNotice');

            let selectedOption = document.getElementById('selectPeriod').options[document.getElementById('selectPeriod').selectedIndex];
            let displayPeriod = selectedOption ? selectedOption.textContent.split(' (')[0] : period;
            
            if (period === 'MONTH' || period.startsWith('Q') || period === 'YEAR') {
                btnSave.classList.add('hidden');
                notice.classList.remove('hidden');

                let weeksToAggregate = [];
                const monthNum = parseInt(month.replace('M', ''));

                const monthWeeksMap = {
                    1: [1,2,3,4,5], 2: [6,7,8,9], 3: [10,11,12,13,14],
                    4: [15,16,17,18], 5: [19,20,21,22], 6: [23,24,25,26,27],
                    7: [28,29,30,31], 8: [32,33,34,35], 9: [36,37,38,39],
                    10: [40,41,42,43,44], 11: [45,46,47,48], 12: [49,50,51,52]
                };

                if (period === 'MONTH') {
                    weeksToAggregate = monthWeeksMap[monthNum] || [];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP CẢ THÁNG ${monthNum} - NĂM ${year}`;
                } else if (period === 'Q1') {
                    weeksToAggregate = [...monthWeeksMap[1], ...monthWeeksMap[2], ...monthWeeksMap[3]];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP QUÝ I - NĂM ${year}`;
                } else if (period === 'Q2') {
                    weeksToAggregate = [...monthWeeksMap[4], ...monthWeeksMap[5], ...monthWeeksMap[6]];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP QUÝ II - NĂM ${year}`;
                } else if (period === 'Q3') {
                    weeksToAggregate = [...monthWeeksMap[7], ...monthWeeksMap[8], ...monthWeeksMap[9]];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP QUÝ III - NĂM ${year}`;
                } else if (period === 'Q4') {
                    weeksToAggregate = [...monthWeeksMap[10], ...monthWeeksMap[11], ...monthWeeksMap[12]];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP QUÝ IV - NĂM ${year}`;
                } else if (period === 'YEAR') {
                    for (let w = 1; w <= 52; w++) weeksToAggregate.push(w);
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP CẢ NĂM ${year}`;
                }

                renderTables(true);

                let aggregated = cmaList.map(cma => ({
                    cma: cma,
                    categories: Array.from({length: categories.length}, () => ({tot: 0, on: 0}))
                }));

                weeksToAggregate.forEach(wNum => {
                    let primaryKey = `HUEWACO_${year}_WEEK_${wNum}`;
                    let weekData = (cloudCache && cloudCache[primaryKey]) ? cloudCache[primaryKey] : null;

                    if (!weekData) {
                        let localData = localStorage.getItem(primaryKey);
                        if (localData) {
                            try { weekData = JSON.parse(localData); } catch(e) {}
                        }
                    }

                    if (weekData && Array.isArray(weekData)) {
                        weekData.forEach((r, rIdx) => {
                            if (r.categories) {
                                r.categories.forEach((cat, cIdx) => {
                                    if (aggregated[rIdx] && aggregated[rIdx].categories[cIdx]) {
                                        aggregated[rIdx].categories[cIdx].tot += parseInt(cat.tot, 10) || 0;
                                        aggregated[rIdx].categories[cIdx].on += parseInt(cat.on, 10) || 0;
                                    }
                                });
                            }
                        });
                    }
                });

                let fixedRows = document.querySelectorAll('#fixedTableBody tr');
                let scrollRows = document.querySelectorAll('#scrollableTableBody tr');

                aggregated.forEach((rData, rIdx) => {
                    let fixedRow = fixedRows[rIdx];
                    let scrollRow = scrollRows[rIdx];
                    let rTotAll = 0, rOnAll = 0;

                    if (fixedRow && scrollRow) {
                        rData.categories.forEach((cat, cIdx) => {
                            let c = cIdx + 1;
                            if (filter === "ALL" || filter == c) {
                                let totElem = scrollRow.querySelector(`.cat-tot-${c}`);
                                let onElem = scrollRow.querySelector(`.cat-on-${c}`);
                                let pctElem = scrollRow.querySelector(`.cat-pct-${c}`);

                                if (totElem) totElem.textContent = cat.tot;
                                if (onElem) onElem.textContent = cat.on;
                                if (pctElem) pctElem.textContent = cat.tot > 0 ? Math.round((cat.on / cat.tot) * 100) + '%' : '0%';
                            }
                            rTotAll += cat.tot;
                            rOnAll += cat.on;
                        });

                        fixedRow.querySelector('.row-total-all').textContent = rTotAll;
                        fixedRow.querySelector('.row-online-all').textContent = rOnAll;
                        fixedRow.querySelector('.row-pct-all').textContent = rTotAll > 0 ? Math.round((rOnAll / rTotAll) * 100) + '%' : '0%';
                    }
                });

                calculateTableTotals();

            } else {
                btnSave.classList.remove('hidden');
                notice.classList.add('hidden');
                document.getElementById('tableTitle').textContent = `NHẬP LIỆU: ${displayPeriod.toUpperCase()} - THÁNG ${month.replace('M','')} - NĂM ${year}`;

                renderTables(false);

                let primaryKey = `HUEWACO_${year}_${period}`;

                let weekData = (cloudCache && cloudCache[primaryKey]) ? cloudCache[primaryKey] : null;
                if (!weekData) {
                    let saved = localStorage.getItem(primaryKey);
                    if (saved) {
                        try { weekData = JSON.parse(saved); } catch(e) {}
                    }
                }

                if (weekData && Array.isArray(weekData)) {
                    applyDataToTable(weekData);
                }
            }
            
            // Cập nhật lại trạng thái ô chỉnh sửa theo phân quyền
            if (typeof window.applyPermissionsState === 'function') {
                window.applyPermissionsState();
            }
        }

            merges.push({ s: { r: 2, c: 0 }, e: { r: 3, c: 0 } }); 
            merges.push({ s: { r: 2, c: 1 }, e: { r: 3, c: 1 } }); 
            merges.push({ s: { r: 2, c: 2 }, e: { r: 2, c: 4 } });

                    let c = cat.id;
                    let tot = scrollRow.querySelector(`.tot-${c}`) ?

                });

                wsData.push(rowData);
            });

            footRow.push(parseInt(document.getElementById('footTotalAll').textContent) || 0);
            footRow.push(parseInt(document.getElementById('footOnlineAll').textContent) || 0);
            footRow.push(document.getElementById('footPctAll').textContent);

                let tot = parseInt(document.getElementById(`footCatTot-${c}`)?.textContent) || 0;

            ws['!merges'] = merges;

            let colWidths = [{ wch: 6 }, { wch: 15 }, { wch: 10 }, { wch: 10 }, { wch: 8 }];
            selectedCats.forEach(() => {
                colWidths.push({ wch: 10 }, { wch: 10 }, { wch: 8 });
            });
            ws['!cols'] = colWidths;

            const range = XLSX.utils.decode_range(ws['!ref']);
            for (let R = range.s.r; R <= range.e.r; ++R) {
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const cell_address = XLSX.utils.encode_cell({ r: R, c: C });
                    if (!ws[cell_address]) continue;

                    if (R === 0) {
                        ws[cell_address].s = styleTitle;
                    } else if (R === 2) {
                        if (C < 2) ws[cell_address].s = styleHeaderTop;
                        else if (C >= 2 && C <= 4) ws[cell_address].s = styleHeaderTotalTop;
                        else ws[cell_address].s = styleHeaderTop;
                    } else if (R === 3) {
                        if (C < 2) ws[cell_address].s = styleHeaderTop;
                        else if (C >= 2 && C <= 4) ws[cell_address].s = styleHeaderTotalSub;
                        else ws[cell_address].s = styleHeaderSub;
                    } else if (R === range.e.r) {
                        ws[cell_address].s = styleFoot;
                    } else {
                        if (C === 0 || C === 1) ws[cell_address].s = styleCma;
                        else if (C >= 2 && C <= 4) ws[cell_address].s = styleTotalLight;
                        else ws[cell_address].s = styleDataNum;
                    }
                }
            }

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "TongHopOnline");
            
            let fileName = `BaoCao_Online_HueWACO_${year}_${month}_${period}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }

                    let canEditThisRow = false;
                    if (currentUser) {
                        if (currentUser.allowAll || currentUser.allowedCma === areaName) {
                            canEditThisRow = true;
                        }
                    }

                    inputs.forEach(input => {
                        if (canEditThisRow) {
                            input.removeAttribute('readonly');
                            input.classList.remove('bg-gray-100', 'cursor-not-allowed');
                        } else {
                            input.setAttribute('readonly', 'true');
                            input.classList.add('bg-gray-100', 'cursor-not-allowed');
                        }
                    });
                });
            }
        };

        window.applyPermissions = function() {
            const userBox = document.getElementById('userInfoDisplay');
            const nameElem = document.getElementById('displayUserName');
            const deptElem = document.getElementById('displayUserDept');
            const btnSave = document.getElementById('btnSave');
            const btnLogin = document.getElementById('btnLogin');

            if (currentUser) {
                if (nameElem) nameElem.textContent = currentUser.name || currentUser.username || '';
                if (deptElem) deptElem.textContent = currentUser.department || '';
                
                if (userBox) {
                    userBox.classList.remove('hidden');
                    userBox.style.setProperty('display', 'flex', 'important');
                }

                if (btnLogin) {
                    btnLogin.innerHTML = `🔓 ${currentUser.name || currentUser.username} (Đăng xuất)`;
                    btnLogin.onclick = window.logout;
                    btnLogin.className = "bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1.5 px-3 rounded shadow-sm text-xs whitespace-nowrap flex items-center justify-center gap-1";
                }

                if (btnSave) btnSave.classList.remove('hidden');

            } else {
                if (nameElem) nameElem.textContent = '';
                if (deptElem) deptElem.textContent = '';
                if (userBox) {
                    userBox.classList.add('hidden');
                    userBox.style.setProperty('display', 'none', 'important');
                }

                if (btnLogin) {
                    btnLogin.innerHTML = `🔒 Đăng nhập`;
                    btnLogin.onclick = window.toggleLoginModal;
                    btnLogin.className = "bg-amber-600 hover:bg-amber-700 text-white font-bold py-1.5 px-3 rounded shadow-sm text-xs whitespace-nowrap flex items-center justify-center gap-1";
                }

                if (btnSave) btnSave.classList.add('hidden');
            }

            loadData();
        };

        // ==========================================
        // 🚀 KHỐI LỆNH KHỞI CHẠY DUY NHẤT
        // ==========================================
        document.addEventListener('DOMContentLoaded', function() {
            initTime();
            initWeekRangeDropdowns();

            preloadAllCloudData(() => {
                applyPermissions();
            });
        });
    </script>
</body>
</html>
