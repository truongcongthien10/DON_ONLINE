<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chương Trình Báo Cáo & Tổng Hợp Đơn Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .table-input input { 
            width: 100%; 
            text-align: right; 
            border: 1px solid #cbd5e1; 
            border-radius: 4px; 
            padding: 4px;
            transition: background-color 0.2s ease;
        }
        /* Highlight vàng nhạt khi focus vào ô nhập liệu */
        .table-input input:focus { 
            outline: 2px solid #f59e0b; 
            background-color: #fef3c7 !important; 
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-800 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">BÁO CÁO TỔNG HỢP ĐƠN ONLINE (CMA)</h1>
            <span class="text-sm bg-blue-700 px-3 py-1 rounded">Hệ Thống Báo Cáo GitHub Pages</span>
        </div>
    </header>

    <div class="container mx-auto p-4 space-y-6">

        <!-- Bộ Lọc / Thao Tác -->
        <div class="bg-white p-4 rounded-lg shadow border border-slate-200 grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Loại Thao Tác:</label>
                <select id="selectMode" onchange="toggleMode()" class="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500 font-semibold text-blue-800">
                    <option value="TH">Báo Cáo / Nhập Thực Hiện Tháng</option>
                    <option value="KH">Nhập Kế Hoạch Cho Từng Năm</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Chọn Năm:</label>
                <select id="selectYear" onchange="loadData()" class="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500">
                    <!-- Javascript nạp năm đến 2030 -->
                </select>
            </div>
            <div id="periodContainer">
                <label class="block text-sm font-medium text-slate-700 mb-1">Chọn Kỳ Báo Cáo:</label>
                <select id="selectPeriod" onchange="loadData()" class="w-full border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500">
                    <option value="T1">Tháng 1</option><option value="T2">Tháng 2</option><option value="T3">Tháng 3</option>
                    <option value="T4">Tháng 4</option><option value="T5">Tháng 5</option><option value="T6">Tháng 6</option>
                    <option value="T7">Tháng 7</option><option value="T8">Tháng 8</option><option value="T9">Tháng 9</option>
                    <option value="T10">Tháng 10</option><option value="T11">Tháng 11</option><option value="T12">Tháng 12</option>
                    <option value="Q1">Quý 1</option><option value="Q2">Quý 2</option>
                    <option value="Q3">Quý 3</option><option value="Q4">Quý 4</option>
                    <option value="NAM">Cả Năm</option>
                </select>
            </div>
            <div>
                <button onclick="loadData()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-medium shadow">
                    Xem / Tra Cứu
                </button>
            </div>
            <div>
                <button onclick="saveData()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded font-medium shadow">
                    Lưu Số Liệu
                </button>
            </div>
        </div>

        <!-- Bảng Dữ Liệu -->
        <div class="bg-white p-4 rounded-lg shadow border border-slate-200 overflow-x-auto">
            <h2 id="tableTitle" class="text-lg font-semibold text-slate-800 mb-3">
                Dữ Liệu Báo Cáo
            </h2>
            
            <table class="w-full text-xs text-left text-slate-600 border-collapse border border-slate-300">
                <thead class="bg-slate-200 text-slate-700 uppercase font-bold text-center">
                    <tr>
                        <th rowspan="2" class="border border-slate-300 p-2 min-w-[110px]">Tên CMA</th>
                        <th colspan="3" class="border border-slate-300 p-1">Lắp Đặt</th>
                        <th colspan="3" class="border border-slate-300 p-1">Cải Tạo</th>
                        <th colspan="3" class="border border-slate-300 p-1">Nâng Dời Hạ</th>
                        <th colspan="3" class="border border-slate-300 p-1">Dò Tìm Rò Rỉ</th>
                        <th colspan="3" class="border border-slate-300 p-1">Thay Định Kỳ</th>
                        <th colspan="3" class="border border-slate-300 p-1">Sửa Chữa / BT</th>
                        <th colspan="3" class="border border-slate-300 p-1">Kiểm Định / Khác</th>
                    </tr>
                    <tr class="bg-slate-100">
                        <!-- Tạo 7 cặp cột KH/TH/% cho 7 hạng mục -->
                        <th class="border border-slate-300 p-1">KH</th><th class="border border-slate-300 p-1">TH</th><th class="border border-slate-300 p-1">%</th>
                        <th class="border border-slate-300 p-1">KH</th><th class="border border-slate-300 p-1">TH</th><th class="border border-slate-300 p-1">%</th>
                        <th class="border border-slate-300 p-1">KH</th><th class="border border-slate-300 p-1">TH</th><th class="border border-slate-300 p-1">%</th>
                        <th class="border border-slate-300 p-1">KH</th><th class="border border-slate-300 p-1">TH</th><th class="border border-slate-300 p-1">%</th>
                        <th class="border border-slate-300 p-1">KH</th><th class="border border-slate-300 p-1">TH</th><th class="border border-slate-300 p-1">%</th>
                        <th class="border border-slate-300 p-1">KH</th><th class="border border-slate-300 p-1">TH</th><th class="border border-slate-300 p-1">%</th>
                        <th class="border border-slate-300 p-1">KH</th><th class="border border-slate-300 p-1">TH</th><th class="border border-slate-300 p-1">%</th>
                    </tr>
                </thead>
                <tbody id="cmaDataBody" class="table-input">
                    <!-- Tự động nạp dòng dữ liệu -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const cmaList = ["Thuận Hóa", "Phú Xuân", "Phong Điền", "Quảng Điền", "Hương Trà", "Hương Thủy", "Phú Vang", "Nam Đông", "A Lưới"];
        const totalCategories = 7; // 7 hạng mục công việc từ sheet TỔNG HỢP

        // Khởi tạo năm & thiết lập mặc định theo thời gian thực (2026, Tháng 9)
        function initTimeDefaults() {
            const selectYear = document.getElementById('selectYear');
            const selectPeriod = document.getElementById('selectPeriod');
            
            const now = new Date();
            const currentYear = now.getFullYear(); // Lấy năm hiện tại
            const currentMonth = now.getMonth() + 1; // Lấy tháng hiện tại (1-12)

            for (let y = 2024; y <= 2030; y++) {
                let opt = document.createElement('option');
                opt.value = y;
                opt.textContent = "Năm " + y;
                if (y === currentYear) opt.selected = true;
                selectYear.appendChild(opt);
            }

            selectPeriod.value = "T" + currentMonth;
        }

        // Chuyển đổi giữa chế độ Nhập KH Năm và Báo Cáo Tháng
        function toggleMode() {
            const mode = document.getElementById('selectMode').value;
            const periodContainer = document.getElementById('periodContainer');
            
            if (mode === 'KH') {
                periodContainer.style.display = 'none';
            } else {
                periodContainer.style.display = 'block';
            }
            loadData();
        }

        // Vẽ danh sách các ô nhập số liệu
        function renderRows() {
            const tbody = document.getElementById('cmaDataBody');
            const mode = document.getElementById('selectMode').value;
            tbody.innerHTML = '';

            cmaList.forEach((cma, index) => {
                let row = document.createElement('tr');
                row.className = index % 2 === 0 ? 'bg-white' : 'bg-slate-50';
                
                let html = `<td class="border border-slate-300 p-2 font-medium text-slate-900">${cma}</td>`;
                
                for (let i = 1; i <= totalCategories; i++) {
                    if (mode === 'KH') {
                        html += `
                            <td class="border border-slate-300 p-1" colspan="2"><input type="number" class="kh-${i} bg-amber-50 font-medium" value="0"></td>
                            <td class="border border-slate-300 p-1 text-center font-semibold text-slate-400">-</td>
                        `;
                    } else {
                        html += `
                            <td class="border border-slate-300 p-1"><input type="number" class="kh-${i} bg-slate-100" value="0" readonly></td>
                            <td class="border border-slate-300 p-1"><input type="number" class="th-${i}" value="0" onchange="calcPercent(this)"></td>
                            <td class="border border-slate-300 p-1 text-center font-semibold text-blue-600 pct-${i}">0%</td>
                        `;
                    }
                }
                
                row.innerHTML = html;
                tbody.appendChild(row);
            });
        }

        // Tính toán tỷ lệ % thực hiện so với kế hoạch
        function calcPercent(input) {
            let row = input.closest('tr');
            for (let i = 1; i <= totalCategories; i++) {
                let khInput = row.querySelector(`.kh-${i}`);
                let thInput = row.querySelector(`.th-${i}`);
                let pctElem = row.querySelector(`.pct-${i}`);

                if (khInput && thInput && pctElem) {
                    let kh = parseFloat(khInput.value) || 0;
                    let th = parseFloat(thInput.value) || 0;
                    
                    if (kh > 0) {
                        let pct = ((th / kh) * 100).toFixed(1);
                        pctElem.textContent = pct + '%';
                        pctElem.className = pct >= 100 ? "border border-slate-300 p-1 text-center font-semibold text-emerald-600" 
                                                       : "border border-slate-300 p-1 text-center font-semibold text-amber-600";
                    } else {
                        pctElem.textContent = '0%';
                    }
                }
            }
        }

        // Lưu dữ liệu vào LocalStorage
        function saveData() {
            let year = document.getElementById('selectYear').value;
            let mode = document.getElementById('selectMode').value;
            let period = document.getElementById('selectPeriod').value;

            if (mode === 'KH') {
                let key = `CMA_KH_${year}`;
                let data = [];
                document.querySelectorAll('#cmaDataBody tr').forEach((row, idx) => {
                    let rowData = { cma: cmaList[idx], items: [] };
                    for (let i = 1; i <= totalCategories; i++) {
                        rowData.items.push(row.querySelector(`.kh-${i}`).value);
                    }
                    data.push(rowData);
                });
                localStorage.setItem(key, JSON.stringify(data));
                alert(`Đã lưu Kế Hoạch thành công cho Năm ${year}!`);
            } else {
                let key = `CMA_TH_${year}_${period}`;
                let data = [];
                document.querySelectorAll('#cmaDataBody tr').forEach((row, idx) => {
                    let rowData = { cma: cmaList[idx], items: [] };
                    for (let i = 1; i <= totalCategories; i++) {
                        rowData.items.push(row.querySelector(`.th-${i}`).value);
                    }
                    data.push(rowData);
                });
                localStorage.setItem(key, JSON.stringify(data));
                alert(`Đã lưu số liệu Thực Hiện thành công cho ${period} - Năm ${year}!`);
            }
        }

        // Tải số liệu từ bộ nhớ LocalStorage
        function loadData() {
            let year = document.getElementById('selectYear').value;
            let mode = document.getElementById('selectMode').value;
            let period = document.getElementById('selectPeriod').value;

            renderRows();

            if (mode === 'KH') {
                document.getElementById('tableTitle').textContent = `Nhập Kế Hoạch Cho Từng CMA (Năm ${year})`;
                let savedKH = localStorage.getItem(`CMA_KH_${year}`);
                if (savedKH) {
                    let data = JSON.parse(savedKH);
                    document.querySelectorAll('#cmaDataBody tr').forEach((row, idx) => {
                        if (data[idx]) {
                            for (let i = 1; i <= totalCategories; i++) {
                                row.querySelector(`.kh-${i}`).value = data[idx].items[i-1] || 0;
                            }
                        }
                    });
                }
            } else {
                document.getElementById('tableTitle').textContent = `Số Liệu Báo Cáo CMA & So Sánh Kế Hoạch (${period} - Năm ${year})`;
                
                // Tải Kế hoạch Năm tương ứng
                let savedKH = localStorage.getItem(`CMA_KH_${year}`);
                if (savedKH) {
                    let dataKH = JSON.parse(savedKH);
                    document.querySelectorAll('#cmaDataBody tr').forEach((row, idx) => {
                        if (dataKH[idx]) {
                            for (let i = 1; i <= totalCategories; i++) {
                                row.querySelector(`.kh-${i}`).value = dataKH[idx].items[i-1] || 0;
                            }
                        }
                    });
                }

                // Tải Thực hiện Tháng tương ứng
                let savedTH = localStorage.getItem(`CMA_TH_${year}_${period}`);
                if (savedTH) {
                    let dataTH = JSON.parse(savedTH);
                    document.querySelectorAll('#cmaDataBody tr').forEach((row, idx) => {
                        if (dataTH[idx]) {
                            for (let i = 1; i <= totalCategories; i++) {
                                row.querySelector(`.th-${i}`).value = dataTH[idx].items[i-1] || 0;
                            }
                            calcPercent(row.querySelector(`.th-1`));
                        }
                    });
                }
            }
        }

        // Khởi chạy ứng dụng
        initTimeDefaults();
        loadData();
    </script>
</body>
</html>
