<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Tổng Hợp Đơn Online - HueWACO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box !important;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { 
            -moz-appearance: textfield; 
        }

        /* Đồng bộ lưới bảng Excel */
        .excel-table {
            table-layout: fixed !important;
            border-collapse: separate !important;
            border-spacing: 0 !important;
            background-color: #ffffff;
            border-top: 1px solid #d1d5db;
        }

        .excel-table th, 
        .excel-table td {
            border-right: 1px solid #d1d5db !important;
            border-bottom: 1px solid #d1d5db !important;
            padding: 0;
            font-size: 12px;
            white-space: nowrap;
            vertical-align: middle;
            overflow: hidden;
            text-align: center;
        }

        #fixedTable {
            border-left: 1px solid #d1d5db;
        }

        .border-split-right {
            border-right: 2px solid #1e3a8a !important;
        }

        /* Cấu hình chiều cao cố định */
        .excel-table th.h-header-top { height: 48px !important; }
        .excel-table th.h-header-sub { height: 36px !important; }
        .excel-table tr, .excel-table td { height: 28px !important; }

        .excel-table input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none !important;
            border-radius: 0 !important;
            text-align: center;
            font-size: 12px;
            outline: none;
            margin: 0;
            padding: 0;
            color: #0f172a;
        }

        .excel-table input:focus {
            background-color: #fef08a !important;
            box-shadow: inset 0 0 0 2px #2563eb !important;
            font-weight: bold;
        }

        .bg-excel-header { background-color: #1e3a8a; color: #ffffff; } 
        .bg-excel-cma { background-color: #0f172a; color: #ffffff; } 
        .bg-excel-total-light { background-color: #fef3c7; font-weight: bold; }
        .bg-excel-foot { background-color: #1e293b; color: #ffffff; font-weight: bold; }

        /* Thanh cuộn bảng */
        .scrollable-table-container::-webkit-scrollbar {
            height: 10px;
        }
        .scrollable-table-container::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .scrollable-table-container::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        .scrollable-table-container::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4">

    <!-- Header HueWACO -->
    <header class="relative bg-blue-900 text-white p-6 rounded-t-lg shadow-lg border-b-4 border-yellow-500 overflow-hidden mb-4">
        <div class="relative z-10 text-center">
            <h1 class="text-2xl font-bold uppercase tracking-wide">Công ty Cổ phần Cấp nước Thừa Thiên Huế (HueWACO)</h1>
            <p class="text-sm font-light mt-1">Báo Cáo Tổng Hợp Đơn Online</p>
        </div>
    </header>

    <!-- Bộ lọc & Thao tác -->
    <div class="bg-white p-4 rounded-b-lg shadow-md mb-6 flex flex-wrap gap-4 items-center justify-between">
        <div class="flex flex-wrap items-center gap-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Từ ngày:</label>
                <input type="date" id="fromDate" class="border border-gray-300 rounded px-2 py-1 text-sm outline-none focus:border-blue-600">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Đến ngày:</label>
                <input type="date" id="toDate" class="border border-gray-300 rounded px-2 py-1 text-sm outline-none focus:border-blue-600">
            </div>
            <div class="self-end">
                <button onclick="renderTable()" class="bg-blue-800 hover:bg-blue-900 text-white px-4 py-1.5 rounded text-sm font-medium transition">
                    Lọc dữ liệu
                </button>
            </div>
        </div>
        <div class="flex items-center gap-2 self-end">
            <button onclick="exportExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded text-sm font-medium transition">
                Xuất Excel
            </button>
        </div>
    </div>

    <!-- Khung chứa Bảng báo cáo Excel -->
    <div class="bg-white p-4 rounded-lg shadow-md overflow-hidden">
        <div class="flex w-full overflow-hidden">
            
            <!-- Cột cố định bên trái (Đơn vị / Loại đơn) -->
            <div class="flex-none z-10">
                <table id="fixedTable" class="excel-table border-split-right">
                    <thead>
                        <tr>
                            <th class="h-header-top bg-excel-header w-12">STT</th>
                            <th class="h-header-top bg-excel-header w-48">Đơn vị / Chi nhánh</th>
                        </tr>
                        <tr>
                            <th class="h-header-sub bg-excel-header"></th>
                            <th class="h-header-sub bg-excel-header"></th>
                        </tr>
                    </thead>
                    <tbody id="fixedTableBody">
                        <!-- Dữ liệu cố định được sinh ra bằng Javascript -->
                    </tbody>
                </table>
            </div>

            <!-- Các cột dữ liệu cuộn ngang bên phải -->
            <div class="flex-1 overflow-x-auto scrollable-table-container">
                <table id="scrollableTable" class="excel-table">
                    <thead>
                        <tr>
                            <th colspan="3" class="h-header-top bg-excel-header">Cấp mới dịch vụ</th>
                            <th colspan="3" class="h-header-top bg-excel-header">Sửa chữa / Lắp đặt</th>
                            <th colspan="3" class="h-header-top bg-excel-header">Thanh toán / Báo sự cố</th>
                            <th colspan="3" class="h-header-top bg-excel-cma">Tổng cộng</th>
                        </tr>
                        <tr>
                            <th class="h-header-sub bg-excel-header w-20">Tiếp nhận</th>
                            <th class="h-header-sub bg-excel-header w-20">Đã xử lý</th>
                            <th class="h-header-sub bg-excel-header w-20">Tồn đọng</th>
                            
                            <th class="h-header-sub bg-excel-header w-20">Tiếp nhận</th>
                            <th class="h-header-sub bg-excel-header w-20">Đã xử lý</th>
                            <th class="h-header-sub bg-excel-header w-20">Tồn đọng</th>

                            <th class="h-header-sub bg-excel-header w-20">Tiếp nhận</th>
                            <th class="h-header-sub bg-excel-header w-20">Đã xử lý</th>
                            <th class="h-header-sub bg-excel-header w-20">Tồn đọng</th>

                            <th class="h-header-sub bg-excel-cma w-24">Tổng nhận</th>
                            <th class="h-header-sub bg-excel-cma w-24">Tổng xử lý</th>
                            <th class="h-header-sub bg-excel-cma w-24">Tổng tồn</th>
                        </tr>
                    </thead>
                    <tbody id="scrollableTableBody">
                        <!-- Dữ liệu số liệu được sinh ra bằng Javascript -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- Logic Xử lý Dữ liệu -->
    <script>
        // Danh sách các Đơn vị / Chi nhánh HueWACO
        const units = [
            "Xí nghiệp Cấp nước Thành phố",
            "Chi nhánh Cấp nước Hương Thủy",
            "Chi nhánh Cấp nước Hương Trà",
            "Chi nhánh Cấp nước Phong Điền",
            "Chi nhánh Cấp nước Quảng Điền",
            "Chi nhánh Cấp nước Phú Vang",
            "Chi nhánh Cấp nước Phú Lộc",
            "Chi nhánh Cấp nước Nam Đông",
            "Chi nhánh Cấp nước A Lưới"
        ];

        // Khởi tạo bảng dữ liệu
        function renderTable() {
            const fixedBody = document.getElementById('fixedTableBody');
            const scrollBody = document.getElementById('scrollableTableBody');

            fixedBody.innerHTML = '';
            scrollBody.innerHTML = '';

            // Sinh các dòng dữ liệu mẫu
            units.forEach((unit, index) => {
                // Dòng cho bảng cố định
                const fRow = document.createElement('tr');
                fRow.innerHTML = `
                    <td class="font-medium text-gray-600">${index + 1}</td>
                    <td class="text-left px-2 font-semibold text-gray-800">${unit}</td>
                `;
                fixedBody.appendChild(fRow);

                // Dòng cho bảng số liệu cuộn (Mặc định cho nhập dữ liệu/hiển thị)
                const sRow = document.createElement('tr');
                sRow.setAttribute('data-row', index);
                sRow.innerHTML = `
                    <td><input type="number" class="val-input" data-col="0" value="${Math.floor(Math.random() * 50) + 10}" oninput="calculateTotals()"></td>
                    <td><input type="number" class="val-input" data-col="1" value="${Math.floor(Math.random() * 40) + 5}" oninput="calculateTotals()"></td>
                    <td class="bg-slate-50 font-medium col-ton-1">0</td>

                    <td><input type="number" class="val-input" data-col="3" value="${Math.floor(Math.random() * 30) + 5}" oninput="calculateTotals()"></td>
                    <td><input type="number" class="val-input" data-col="4" value="${Math.floor(Math.random() * 25) + 5}" oninput="calculateTotals()"></td>
                    <td class="bg-slate-50 font-medium col-ton-2">0</td>

                    <td><input type="number" class="val-input" data-col="6" value="${Math.floor(Math.random() * 20) + 5}" oninput="calculateTotals()"></td>
                    <td><input type="number" class="val-input" data-col="7" value="${Math.floor(Math.random() * 15) + 5}" oninput="calculateTotals()"></td>
                    <td class="bg-slate-50 font-medium col-ton-3">0</td>

                    <td class="bg-excel-total-light row-sum-rec">0</td>
                    <td class="bg-excel-total-light row-sum-proc">0</td>
                    <td class="bg-excel-total-light row-sum-pend text-red-600">0</td>
                `;
                scrollBody.appendChild(sRow);
            });

            // Thêm dòng Tổng cộng ở cuối
            const fFoot = document.createElement('tr');
            fFoot.className = "bg-excel-foot";
            fFoot.innerHTML = `
                <td colspan="2" class="font-bold uppercase text-center py-1">TỔNG CỘNG</td>
            `;
            fixedBody.appendChild(fFoot);

            const sFoot = document.createElement('tr');
            sFoot.id = "totalFooterRow";
            sFoot.className = "bg-excel-foot";
            sFoot.innerHTML = `
                <td id="tot-0">0</td><td id="tot-1">0</td><td id="tot-2">0</td>
                <td id="tot-3">0</td><td id="tot-4">0</td><td id="tot-5">0</td>
                <td id="tot-6">0</td><td id="tot-7">0</td><td id="tot-8">0</td>
                <td id="tot-all-rec">0</td><td id="tot-all-proc">0</td><td id="tot-all-pend" class="text-yellow-300">0</td>
            `;
            scrollBody.appendChild(sFoot);

            calculateTotals();
        }

        // Hàm tính toán tự động Tổng tồn, Tổng ngang, Tổng dọc
        function calculateTotals() {
            const rows = document.querySelectorAll('#scrollableTableBody tr:not(#totalFooterRow)');
            let colSums = new Array(9).fill(0);
            let grandRec = 0, grandProc = 0, grandPend = 0;

            rows.forEach(row => {
                const inputs = row.querySelectorAll('input');
                
                // Lấy giá trị đầu vào
                const c0 = parseInt(inputs[0].value) || 0; // Tiếp nhận 1
                const c1 = parseInt(inputs[1].value) || 0; // Đã xử lý 1
                const c2 = Math.max(0, c0 - c1);           // Tồn 1
                row.querySelector('.col-ton-1').textContent = c2;

                const c3 = parseInt(inputs[2].value) || 0; // Tiếp nhận 2
                const c4 = parseInt(inputs[3].value) || 0; // Đã xử lý 2
                const c5 = Math.max(0, c3 - c4);           // Tồn 2
                row.querySelector('.col-ton-2').textContent = c5;

                const c6 = parseInt(inputs[4].value) || 0; // Tiếp nhận 3
                const c7 = parseInt(inputs[5].value) || 0; // Đã xử lý 3
                const c8 = Math.max(0, c6 - c7);           // Tồn 3
                row.querySelector('.col-ton-3').textContent = c8;

                // Tổng hàng ngang
                const sumRec = c0 + c3 + c6;
                const sumProc = c1 + c4 + c7;
                const sumPend = c2 + c5 + c8;

                row.querySelector('.row-sum-rec').textContent = sumRec;
                row.querySelector('.row-sum-proc').textContent = sumProc;
                row.querySelector('.row-sum-pend').textContent = sumPend;

                // Cộng dồn cột
                colSums[0] += c0; colSums[1] += c1; colSums[2] += c2;
                colSums[3] += c3; colSums[4] += c4; colSums[5] += c5;
                colSums[6] += c6; colSums[7] += c7; colSums[8] += c8;

                grandRec += sumRec;
                grandProc += sumProc;
                grandPend += sumPend;
            });

            // Ghi dữ liệu dòng tổng dọc
            for (let i = 0; i < 9; i++) {
                document.getElementById(`tot-${i}`).textContent = colSums[i];
            }
            document.getElementById('tot-all-rec').textContent = grandRec;
            document.getElementById('tot-all-proc').textContent = grandProc;
            document.getElementById('tot-all-pend').textContent = grandPend;
        }

        // Xuất Excel nhanh
        function exportExcel() {
            alert("Tính năng đã sẵn sàng để tích hợp xuất file Excel (.xlsx)!");
        }

        // Tự động chạy khi tải trang
        window.onload = function() {
            renderTable();
        };
    </script>

</body>
</html>
