<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Tổng Hợp Đơn Online - HueWACO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <style>
        * { box-sizing: border-box !important; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }

        .excel-table {
            table-layout: fixed !important;
            border-collapse: separate !important;
            border-spacing: 0 !important;
            background-color: #ffffff;
            border-top: 1px solid #d1d5db;
        }

        .excel-table th, .excel-table td {
            border-right: 1px solid #d1d5db !important;
            border-bottom: 1px solid #d1d5db !important;
            padding: 0;
            font-size: 12px;
            white-space: nowrap;
            vertical-align: middle;
            overflow: hidden;
            text-align: center;
        }

        #fixedTable { border-left: 1px solid #d1d5db; }
        .border-split-right { border-right: 2px solid #1e3a8a !important; }

        .excel-table th.h-header-top { height: 48px !important; }
        .excel-table th.h-header-sub { height: 36px !important; }
        .excel-table tr, .excel-table td { height: 28px !important; }

        .excel-table input {
            width: 100%; height: 100%;
            background: transparent;
            border: none !important;
            border-radius: 0 !important;
            text-align: center;
            font-size: 12px;
            outline: none; margin: 0; padding: 0;
            color: #0f172a;
        }

        .excel-table input:focus {
            background-color: #fef08a !important;
            box-shadow: inset 0 0 0 2px #2563eb !important;
            font-weight: bold;
        }

        .bg-excel-header { background-color: #1e3a8a; } 
        .bg-excel-cma { background-color: #0f172a; color: #ffffff; } 
        .bg-excel-total-light { background-color: #fef3c7; }
        .bg-excel-foot { background-color: #1e293b; color: #ffffff; }

        .scrollable-table-container::-webkit-scrollbar { height: 10px; }
        .scrollable-table-container::-webkit-scrollbar-track { background: #f1f5f9; }
        .scrollable-table-container::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .scrollable-table-container::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <header class="relative bg-blue-900 text-white p-4 shadow-lg border-b-4 border-yellow-500 overflow-hidden">
        <div class="container mx-auto relative z-10">
            <h1 class="text-xl font-black uppercase tracking-wide drop-shadow-lg text-white">
                TỔNG HỢP ĐƠN ONLINE - HueWACO
            </h1>
            <p class="text-xs text-blue-100 font-medium drop-shadow mt-0.5">
                Chương trình quản lý, tổng hợp báo cáo
            </p>
        </div>
    </header>

    <div class="container mx-auto p-3 space-y-3">
        <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-12 gap-2.5 items-end">
            <div class="md:col-span-2">
                <label class="block text-xs font-bold text-slate-700 mb-1">CHỌN NĂM:</label>
                <select id="selectYear" onchange="updateWeekDropdown(); loadData();" class="w-full border border-slate-300 rounded p-1.5 text-xs font-semibold focus:ring-2 focus:ring-blue-600">
                </select>
            </div>

            <div class="md:col-span-2">
                <label class="block text-xs font-bold text-slate-700 mb-1">CHỌN THÁNG:</label>
                <select id="selectMonth" onchange="updateWeekDropdown(); loadData();" class="w-full border border-slate-300 rounded p-1.5 text-xs font-semibold focus:ring-2 focus:ring-blue-600">
                </select>
            </div>

            <div class="md:col-span-2">
                <label class="block text-xs font-bold text-slate-700 mb-1">KỲ BÁO CÁO:</label>
                <select id="selectPeriod" onchange="loadData()" class="w-full border border-slate-300 rounded p-1.5 text-xs font-bold text-blue-800 focus:ring-2 focus:ring-blue-600">
                </select>
            </div>

            <div class="md:col-span-3">
                <label class="block text-xs font-bold text-blue-900 mb-1">HẠNG MỤC CÔNG VIỆC:</label>
                <select id="selectCategoryFilter" onchange="filterCategoryView()" class="w-full border-2 border-blue-600 rounded p-1.5 text-xs font-bold text-blue-900 bg-blue-50 focus:ring-2 focus:ring-blue-600">
                    <option value="ALL">-- Hiển thị Tất Cả --</option>
                    <option value="1">1. Lắp đặt</option>
                    <option value="2">2. Cải tạo</option>
                    <option value="3">3. Nâng dời hạ</option>
                    <option value="4">4. Dò tìm</option>
                    <option value="5">5. Kiểm định ĐH</option>
                    <option value="6">6. Tạm ngừng</option>
                    <option value="7">7. Cắt hủy</option>
                    <option value="8">8. Mở nước</option>
                    <option value="9">9. Kiểm tra ĐH</option>
                </select>
            </div>

            <div class="md:col-span-3 flex gap-2">
                <button id="btnSave" onclick="saveData()" class="w-1/2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-2 rounded shadow-sm text-xs whitespace-nowrap">
                    💾 Lưu Số Liệu Tuần
                </button>
                <button id="btnExport" onclick="exportToExcel()" class="w-1/2 bg-green-700 hover:bg-green-800 text-white font-bold py-2 px-2 rounded shadow-sm text-xs whitespace-nowrap flex items-center justify-center gap-1">
                    📊 Xuất Excel
                </button>
            </div>
        </div>

        <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-2">
                <h2 id="tableTitle" class="text-sm font-bold text-blue-900 uppercase tracking-wide">
                    NHẬP LIỆU
                </h2>
                <span id="readOnlyNotice" class="hidden text-[11px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded border border-amber-300">
                    🔒 Chế độ Tổng hợp (Xem tự động)
                </span>
            </div>
            
            <div class="flex w-full items-start gap-0">
                <div class="flex-shrink-0 bg-white">
                    <table class="excel-table w-[320px]" id="fixedTable">
                        <thead class="text-white uppercase font-bold">
                            <tr class="bg-excel-header">
                                <th rowspan="2" style="width: 40px;" class="h-header-top bg-slate-900">STT</th>
                                <th rowspan="2" style="width: 100px;" class="h-header-top bg-slate-900">KHU VỰC</th>
                                <th colspan="3" style="width: 180px;" class="h-header-top bg-amber-600 text-yellow-100 border-split-right">TỔNG HỢP</th>
                            </tr>
                            <tr class="bg-slate-800 text-yellow-300 text-[11px]">
                                <th style="width: 60px;" class="h-header-sub bg-amber-700">TỔNG</th>
                                <th style="width: 60px;" class="h-header-sub bg-amber-700">ONLINE</th>
                                <th style="width: 60px;" class="h-header-sub bg-amber-700 border-split-right">%</th>
                            </tr>
                        </thead>
                        <tbody id="fixedTableBody"></tbody>
                        <tfoot id="fixedTableFoot" class="font-bold"></tfoot>
                    </table>
                </div>

                <div class="flex-grow overflow-x-auto scrollable-table-container bg-white">
                    <table class="excel-table" id="scrollableTable">
                        <thead id="scrollableTableHead" class="text-white uppercase font-bold"></thead>
                        <tbody id="scrollableTableBody"></tbody>
                        <tfoot id="scrollableTableFoot" class="font-bold"></tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="customAlertModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
        <div class="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-sm overflow-hidden transform transition-all scale-100">
            <div class="bg-blue-900 text-white font-bold text-sm px-4 py-2.5 flex items-center justify-between border-b border-yellow-500">
                <span class="flex items-center gap-1.5">📢 THÔNG BÁO:</span>
            </div>
            <div class="p-5 text-center text-xs sm:text-sm font-semibold text-slate-800" id="customAlertMessage">
                Nội dung thông báo
            </div>
            <div class="bg-slate-50 px-4 py-3 flex justify-center border-t border-slate-100">
                <button onclick="closeCustomAlert()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-1.5 rounded-lg text-xs transition-colors shadow">
                    OK
                </button>
            </div>
        </div>
    </div>

    <script>
        function showAlert(message) {
            document.getElementById('customAlertMessage').textContent = message;
            document.getElementById('customAlertModal').classList.remove('hidden');
        }

        function closeCustomAlert() {
            document.getElementById('customAlertModal').classList.add('hidden');
        }

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyS7DAFFa0dtWIA7tqVGbkAvqGX138W_V8MljyoSLqrTGx4YaJ28KFBP-I5XpBTPMk/exec";
        const cmaList = ["Phú Xuân", "Thuận Hóa", "A Lưới", "Kim Long", "Hương Trà", "Phong Điền", "Hương Thủy", "Phú Vang", "Phú Lộc"];
        const categories = ["Lắp đặt", "Cải tạo", "Nâng dời hạ", "Dò tìm", "Kiểm định ĐH", "Tạm ngừng", "Cắt hủy", "Mở nước", "Kiểm tra ĐH"];

        function isIntegerKey(evt) {
            const charCode = (evt.which) ? evt.which : evt.keyCode;
            if ([8, 9, 27, 13, 46, 37, 38, 39, 40].indexOf(charCode) !== -1 ||
                (charCode >= 48 && charCode <= 57) || (charCode >= 96 && charCode <= 105)) {
                return true;
            }
            evt.preventDefault();
            return false;
        }

        function cleanIntegerInput(input) {
            input.value = input.value.replace(/[^0-9]/g, '');
        }

        const weeks2026 = [
            { week: 1, month: 1, start: "29/12/2025", end: "04/01/2026" },
            { week: 2, month: 1, start: "05/01", end: "11/01" },
            { week: 3, month: 1, start: "12/01", end: "18/01" },
            { week: 4, month: 1, start: "19/01", end: "25/01" },
            { week: 5, month: 1, start: "26/01", end: "01/02" },

            { week: 6, month: 2, start: "02/02", end: "08/02" },
            { week: 7, month: 2, start: "09/02", end: "15/02" },
            { week: 8, month: 2, start: "16/02", end: "22/02" },
            { week: 9, month: 2, start: "23/02", end: "01/03" },

            { week: 10, month: 3, start: "02/03", end: "08/03" },
            { week: 11, month: 3, start: "09/03", end: "15/03" },
            { week: 12, month: 3, start: "16/03", end: "22/03" },
            { week: 13, month: 3, start: "23/03", end: "29/03" },
            { week: 14, month: 3, start: "30/03", end: "05/04" },

            { week: 15, month: 4, start: "06/04", end: "12/04" },
            { week: 16, month: 4, start: "13/04", end: "19/04" },
            { week: 17, month: 4, start: "20/04", end: "26/04" },
            { week: 18, month: 4, start: "27/04", end: "03/05" },

            { week: 19, month: 5, start: "04/05", end: "10/05" },
            { week: 20, month: 5, start: "11/05", end: "17/05" },
            { week: 21, month: 5, start: "18/05", end: "24/05" },
            { week: 22, month: 5, start: "25/05", end: "31/05" },

            { week: 23, month: 6, start: "01/06", end: "07/06" },
            { week: 24, month: 6, start: "08/06", end: "14/06" },
            { week: 25, month: 6, start: "15/06", end: "21/06" },
            { week: 26, month: 6, start: "22/06", end: "28/06" },
            { week: 27, month: 6, start: "29/06", end: "05/07" },

            { week: 28, month: 7, start: "06/07", end: "12/07" },
            { week: 29, month: 7, start: "13/07", end: "19/07" },
            { week: 30, month: 7, start: "20/07", end: "26/07" },
            { week: 31, month: 7, start: "27/07", end: "02/08" },

            { week: 32, month: 8, start: "03/08", end: "09/08" },
            { week: 33, month: 8, start: "10/08", end: "16/08" },
            { week: 34, month: 8, start: "17/08", end: "23/08" },
            { week: 35, month: 8, start: "24/08", end: "30/08" },

            { week: 36, month: 9, start: "31/08", end: "06/09" },
            { week: 37, month: 9, start: "07/09", end: "13/09" },
            { week: 38, month: 9, start: "14/09", end: "20/09" },
            { week: 39, month: 9, start: "21/09", end: "27/09" },

            { week: 40, month: 10, start: "28/09", end: "04/10" },
            { week: 41, month: 10, start: "05/10", end: "11/10" },
            { week: 42, month: 10, start: "12/10", end: "18/10" },
            { week: 43, month: 10, start: "19/10", end: "25/10" },
            { week: 44, month: 10, start: "26/10", end: "01/11" },

            { week: 45, month: 11, start: "02/11", end: "08/11" },
            { week: 46, month: 11, start: "09/11", end: "15/11" },
            { week: 47, month: 11, start: "16/11", end: "22/11" },
            { week: 48, month: 11, start: "23/11", end: "29/11" },

            { week: 49, month: 12, start: "30/11", end: "06/12" },
            { week: 50, month: 12, start: "07/12", end: "13/12" },
            { week: 51, month: 12, start: "14/12", end: "20/12" },
            { week: 52, month: 12, start: "21/12", end: "27/12" }
        ];

        function updateWeekDropdown() {
            const year = parseInt(document.getElementById('selectYear').value) || 2026;
            const monthStr = document.getElementById('selectMonth').value || "M9";
            const month = parseInt(monthStr.replace('M', ''));
            const selectPeriod = document.getElementById('selectPeriod');

            const currentSelected = selectPeriod.value;
            selectPeriod.innerHTML = '';

            const filteredWeeks = weeks2026.filter(w => w.month === month);

            filteredWeeks.forEach((wInfo) => {
                let opt = document.createElement('option');
                opt.value = `WEEK_${wInfo.week}`; 
                opt.textContent = `Tuần ${wInfo.week} (${wInfo.start} đến ${wInfo.end})`;
                selectPeriod.appendChild(opt);
            });

            let optMonth = document.createElement('option');
            optMonth.value = "MONTH";
            optMonth.className = "font-bold text-emerald-700";
            optMonth.textContent = `-- Tổng Hợp Cả Tháng ${month}/${year} --`;
            selectPeriod.appendChild(optMonth);

            const quarters = [
                { id: "Q1", name: "Tổng Hợp Quý I (Tháng 1 - 3)" },
                { id: "Q2", name: "Tổng Hợp Quý II (Tháng 4 - 6)" },
                { id: "Q3", name: "Tổng Hợp Quý III (Tháng 7 - 9)" },
                { id: "Q4", name: "Tổng Hợp Quý IV (Tháng 10 - 12)" }
            ];

            quarters.forEach(q => {
                let opt = document.createElement('option');
                opt.value = q.id;
                opt.className = "font-bold text-blue-700";
                opt.textContent = `-- ${q.name} --`;
                selectPeriod.appendChild(opt);
            });

            let optYear = document.createElement('option');
            optYear.value = "YEAR";
            optYear.className = "font-bold text-purple-700";
            optYear.textContent = `-- TỔNG HỢP CẢ NĂM ${year} --`;
            selectPeriod.appendChild(optYear);

            if (currentSelected && Array.from(selectPeriod.options).some(o => o.value === currentSelected)) {
                selectPeriod.value = currentSelected;
            }
        }

        function initTime() {
            const selectYear = document.getElementById('selectYear');
            const selectMonth = document.getElementById('selectMonth');

            selectYear.innerHTML = '';
            selectMonth.innerHTML = '';

            for (let y = 2024; y <= 2030; y++) {
                let opt = document.createElement('option');
                opt.value = y; opt.textContent = "Năm " + y;
                if (y === 2026) opt.selected = true;
                selectYear.appendChild(opt);
            }

            for (let m = 1; m <= 12; m++) {
                let opt = document.createElement('option');
                opt.value = "M" + m; opt.textContent = "Tháng " + m;
                if (m === 9) opt.selected = true;
                selectMonth.appendChild(opt);
            }

            updateWeekDropdown();
        }

        function filterCategoryView() {
            let period = document.getElementById('selectPeriod').value;
            if (period !== 'MONTH' && !period.startsWith('Q') && period !== 'YEAR') {
            saveDataSilent(); // Lưu tạm dữ liệu hạng mục hiện tại trước khi ẩn đi
        }
            loadData();
        }

        function saveDataSilent() {
            let year = document.getElementById('selectYear').value;
            let period = document.getElementById('selectPeriod').value;

            if (period === 'MONTH' || period.startsWith('Q') || period === 'YEAR') return;

            let key = `HUEWACO_${year}_${period}`;
            let existingData = localStorage.getItem(key);
            let data = existingData ? JSON.parse(existingData) : cmaList.map(cma => ({
                cma: cma,
                categories: Array.from({length: categories.length}, () => ({tot: "0", on: "0"}))
            }));

            let scrollRows = document.querySelectorAll('#scrollableTableBody tr');
            let filter = document.getElementById('selectCategoryFilter').value;

            cmaList.forEach((cma, idx) => {
                let row = scrollRows[idx];
                if (!row) return;
                
                categories.forEach((_, cIdx) => {
                    let c = cIdx + 1;
                    if (filter === "ALL" || filter == c) {
                        let totVal = row.querySelector(`.tot-${c}`)?.value || "0";
                        let onVal = row.querySelector(`.on-${c}`)?.value || "0";
                        
                        if (!data[idx].categories[cIdx]) {
                            data[idx].categories[cIdx] = {};
                        }
                        data[idx].categories[cIdx].tot = totVal;
                        data[idx].categories[cIdx].on = onVal;
                    }
                });
            });

            localStorage.setItem(key, JSON.stringify(data));
        }

        function renderScrollableHeader(filter) {
            const thead = document.getElementById('scrollableTableHead');
            let h1 = `<tr class="bg-excel-header">`;
            let h2 = `<tr class="bg-slate-800 text-yellow-300 text-[11px]">`;

            categories.forEach((catName, idx) => {
                let catId = idx + 1;
                if (filter === "ALL" || filter == catId) {
                    h1 += `<th colspan="3" style="width: 225px;" class="h-header-top bg-blue-800 tracking-wider">${catName}</th>`;
                    h2 += `<th style="width: 75px;" class="h-header-sub bg-slate-800">TỔNG</th>
                           <th style="width: 75px;" class="h-header-sub bg-slate-800">ONLINE</th>
                           <th style="width: 75px;" class="h-header-sub bg-slate-800 text-yellow-400">%</th>`;
                }
            });

            h1 += `</tr>`; h2 += `</tr>`;
            thead.innerHTML = h1 + h2;
        }

        function renderTables(isReadOnly = false) {
            const filter = document.getElementById('selectCategoryFilter').value;
            renderScrollableHeader(filter);

            const fixedTbody = document.getElementById('fixedTableBody');
            const scrollTbody = document.getElementById('scrollableTableBody');

            fixedTbody.innerHTML = '';
            scrollTbody.innerHTML = '';

            cmaList.forEach((cma, idx) => {
                let bgClass = idx % 2 === 0 ? 'bg-white' : 'bg-slate-50';

                let trFixed = document.createElement('tr');
                trFixed.className = `${bgClass} hover:bg-blue-50`;
                trFixed.innerHTML = `
                    <td style="width: 40px;" class="bg-excel-cma font-medium">${idx + 1}</td>
                    <td style="width: 100px;" class="bg-excel-cma font-bold !text-left !px-2 truncate">${cma}</td>
                    <td style="width: 60px;" class="font-bold text-blue-900 bg-excel-total-light row-total-all">0</td>
                    <td style="width: 60px;" class="font-bold text-emerald-800 bg-excel-total-light row-online-all">0</td>
                    <td style="width: 60px;" class="font-bold text-amber-900 bg-amber-200 border-split-right row-pct-all">0%</td>
                `;
                fixedTbody.appendChild(trFixed);

                let trScroll = document.createElement('tr');
                trScroll.className = `${bgClass} hover:bg-blue-50`;
                let htmlScroll = '';

                categories.forEach((_, cIdx) => {
                    let c = cIdx + 1;
                    if (filter === "ALL" || filter == c) {
                        if (isReadOnly) {
                            htmlScroll += `
                                <td style="width: 75px;" class="font-semibold cat-tot-${c}">0</td>
                                <td style="width: 75px;" class="font-semibold text-emerald-700 cat-on-${c}">0</td>
                                <td style="width: 75px;" class="font-bold text-blue-700 cat-pct-${c}">0%</td>
                            `;
                        } else {
                            htmlScroll += `
                                <td style="width: 75px;"><input type="number" step="1" min="0" pattern="\\d*" onkeydown="return isIntegerKey(event)" oninput="cleanIntegerInput(this)" class="tot-${c}" value="0" onfocus="this.select()" onchange="calculateRow(${idx}, this)"></td>
                                <td style="width: 75px;"><input type="number" step="1" min="0" pattern="\\d*" onkeydown="return isIntegerKey(event)" oninput="cleanIntegerInput(this)" class="on-${c} text-emerald-700 font-medium" value="0" onfocus="this.select()" onchange="calculateRow(${idx}, this)"></td>
                                <td style="width: 75px;" class="font-bold text-blue-700 pct-${c}">0%</td>
                            `;
                        }
                    }
                });

                trScroll.innerHTML = htmlScroll;
                scrollTbody.appendChild(trScroll);
            });

            renderFooters(filter);
        }

        function renderFooters(filter) {
            const fixedFoot = document.getElementById('fixedTableFoot');
            const scrollFoot = document.getElementById('scrollableTableFoot');

            fixedFoot.innerHTML = `
                <tr class="bg-excel-foot">
                    <td style="width: 40px;" class="p-1 bg-slate-950 text-white">--</td>
                    <td style="width: 100px;" class="p-1 text-left px-2 bg-slate-950 text-white truncate">HueWACO</td>
                    <td style="width: 60px;" class="p-1 bg-amber-600 text-white" id="footTotalAll">0</td>
                    <td style="width: 60px;" class="p-1 bg-amber-600 text-white" id="footOnlineAll">0</td>
                    <td style="width: 60px;" class="p-1 bg-amber-700 text-white border-split-right" id="footPctAll">0%</td>
                </tr>
            `;

            let htmlScrollFoot = `<tr class="bg-excel-foot">`;
            categories.forEach((_, cIdx) => {
                let c = cIdx + 1;
                if (filter === "ALL" || filter == c) {
                    htmlScrollFoot += `
                        <td style="width: 75px;" id="footCatTot-${c}" class="p-1 text-slate-800 bg-slate-200">0</td>
                        <td style="width: 75px;" id="footCatOn-${c}" class="p-1 text-emerald-800 bg-slate-200">0</td>
                        <td style="width: 75px;" id="footCatPct-${c}" class="p-1 text-blue-900 bg-slate-200">0%</td>
                    `;
                }
            });
            htmlScrollFoot += `</tr>`;
            scrollFoot.innerHTML = htmlScrollFoot;
        }

        function applyDataToTable(data) {
            if (!data || !Array.isArray(data)) return;
            let scrollRows = document.querySelectorAll('#scrollableTableBody tr');
            let filter = document.getElementById('selectCategoryFilter').value;

            data.forEach((rData, rIdx) => {
                let scrollRow = scrollRows[rIdx];
                if (!scrollRow) return;

                if (rData.categories && Array.isArray(rData.categories)) {
                    rData.categories.forEach((cat, cIdx) => {
                        let c = cIdx + 1;
                        if (filter === "ALL" || filter == c) {
                            let totInput = scrollRow.querySelector(`.tot-${c}`);
                            let onInput = scrollRow.querySelector(`.on-${c}`);
                            if (totInput) totInput.value = cat.tot || "0";
                            if (onInput) onInput.value = cat.on || "0";
                        }
                    });
                }
                calculateRow(rIdx, null);
            });
        }

function calculateRow(rowIndex, element) {
    let fixedRow = document.querySelectorAll('#fixedTableBody tr')[rowIndex];
    let scrollRow = document.querySelectorAll('#scrollableTableBody tr')[rowIndex];

    if (!fixedRow || !scrollRow) return;

    let grandTotal = 0, grandOnline = 0;

    categories.forEach((_, cIdx) => {
        let c = cIdx + 1;
        let totElem = scrollRow.querySelector(`.tot-${c}`);
        let onElem = scrollRow.querySelector(`.on-${c}`);
        let pctElem = scrollRow.querySelector(`.pct-${c}`);

        let tot = totElem ? (parseInt(totElem.value, 10) || 0) : 0;
        let on = onElem ? (parseInt(onElem.value, 10) || 0) : 0;

        if (pctElem) {
            pctElem.textContent = tot > 0 ? Math.round((on / tot) * 100) + '%' : '0%';
        }

        grandTotal += tot;
        grandOnline += on;
    });

    fixedRow.querySelector('.row-total-all').textContent = grandTotal;
    fixedRow.querySelector('.row-online-all').textContent = grandOnline;
    fixedRow.querySelector('.row-pct-all').textContent = grandTotal > 0 ? Math.round((grandOnline / grandTotal) * 100) + '%' : '0%';

    calculateTableTotals();
    
    // TỰ ĐỘNG LƯU TẠM VÀO BỘ NHỚ MÁY NGAY KHI GÕ SỐ
    saveDataSilent();
    
        }

        function calculateTableTotals() {
            let period = document.getElementById('selectPeriod').value;
            let filter = document.getElementById('selectCategoryFilter').value;
            let fixedRows = document.querySelectorAll('#fixedTableBody tr');
            let scrollRows = document.querySelectorAll('#scrollableTableBody tr');

            let footTotAll = 0, footOnAll = 0;
            let catTotals = Array(categories.length + 1).fill(0);
            let catOnlines = Array(categories.length + 1).fill(0);

            let isReadOnly = period === 'MONTH' || period.startsWith('Q') || period === 'YEAR';

            fixedRows.forEach((fixedRow, idx) => {
                let scrollRow = scrollRows[idx];

                footTotAll += parseInt(fixedRow.querySelector('.row-total-all').textContent, 10) || 0;
                footOnAll += parseInt(fixedRow.querySelector('.row-online-all').textContent, 10) || 0;

                categories.forEach((_, cIdx) => {
                    let c = cIdx + 1;
                    if (filter === "ALL" || filter == c) {
                        let tot = isReadOnly 
                            ? (parseInt(scrollRow.querySelector(`.cat-tot-${c}`)?.textContent, 10) || 0)
                            : (parseInt(scrollRow.querySelector(`.tot-${c}`)?.value, 10) || 0);
                        let on = isReadOnly
                            ? (parseInt(scrollRow.querySelector(`.cat-on-${c}`)?.textContent, 10) || 0)
                            : (parseInt(scrollRow.querySelector(`.on-${c}`)?.value, 10) || 0);

                        catTotals[c] += tot;
                        catOnlines[c] += on;
                    }
                });
            });

            document.getElementById('footTotalAll').textContent = footTotAll;
            document.getElementById('footOnlineAll').textContent = footOnAll;
            document.getElementById('footPctAll').textContent = footTotAll > 0 ? Math.round((footOnAll / footTotAll) * 100) + '%' : '0%';

            categories.forEach((_, cIdx) => {
                let c = cIdx + 1;
                if (filter === "ALL" || filter == c) {
                    let totCell = document.getElementById(`footCatTot-${c}`);
                    let onCell = document.getElementById(`footCatOn-${c}`);
                    let pctCell = document.getElementById(`footCatPct-${c}`);

                    if (totCell) totCell.textContent = catTotals[c];
                    if (onCell) onCell.textContent = catOnlines[c];
                    if (pctCell) pctCell.textContent = catTotals[c] > 0 ? Math.round((catOnlines[c] / catTotals[c]) * 100) + '%' : '0%';
                }
            });
        }

        function saveData() {
            let year = document.getElementById('selectYear').value;
            let period = document.getElementById('selectPeriod').value;

            if (period === 'MONTH' || period.startsWith('Q') || period === 'YEAR') {
                showAlert('Không thể lưu ở chế độ Tổng hợp! Vui lòng chọn tuần cụ thể.');
                return;
            }

            let key = `HUEWACO_${year}_${period}`;
            
            // Đọc dữ liệu cũ từ LocalStorage để không làm mất các hạng mục đang ẩn
            let existingData = localStorage.getItem(key);
            let data = existingData ? JSON.parse(existingData) : cmaList.map(cma => ({
                cma: cma,
                categories: Array.from({length: categories.length}, () => ({tot: "0", on: "0"}))
            }));

            let scrollRows = document.querySelectorAll('#scrollableTableBody tr');
            let filter = document.getElementById('selectCategoryFilter').value;

            cmaList.forEach((cma, idx) => {
                let row = scrollRows[idx];
                if (!row) return;
                
                categories.forEach((_, cIdx) => {
                    let c = cIdx + 1;
                    if (filter === "ALL" || filter == c) {
                        let totInput = row.querySelector(`.tot-${c}`);
                        let onInput = row.querySelector(`.on-${c}`);
                        
                        let totVal = totInput ? totInput.value : "0";
                        let onVal = onInput ? onInput.value : "0";
                        
                        if (!data[idx].categories[cIdx]) {
                            data[idx].categories[cIdx] = {};
                        }
                        data[idx].categories[cIdx].tot = totVal;
                        data[idx].categories[cIdx].on = onVal;
                    }
                });
            });

            // 1. Lưu bản sao vào LocalStorage
            localStorage.setItem(key, JSON.stringify(data));

            let selectedOption = document.getElementById('selectPeriod').options[document.getElementById('selectPeriod').selectedIndex];
            let displayPeriod = selectedOption ? selectedOption.textContent.split(' (')[0] : period;

            // 2. Gửi dữ liệu dạng JSON Raw sang Google Apps Script
            if (typeof GOOGLE_SCRIPT_URL !== 'undefined' && GOOGLE_SCRIPT_URL) {
                let payload = JSON.stringify({
                    key: key,
                    value: data
                });

                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: payload
                })
                .then(() => {
                    showAlert(`Đã lưu & đồng bộ thành công dữ liệu ${displayPeriod}!`);
                })
                .catch(err => {
                    showAlert(`Đã lưu nội bộ nhưng lỗi kết nối Cloud: ${err}`);
                });
            } else {
                showAlert(`Đã lưu thành công dữ liệu ${displayPeriod}!`);
            }
        }

function loadData() {
            let year = document.getElementById('selectYear').value;
            let month = document.getElementById('selectMonth').value;
            let period = document.getElementById('selectPeriod').value;
            let filter = document.getElementById('selectCategoryFilter').value;

            const btnSave = document.getElementById('btnSave');
            const notice = document.getElementById('readOnlyNotice');

            let selectedOption = document.getElementById('selectPeriod').options[document.getElementById('selectPeriod').selectedIndex];
            let displayPeriod = selectedOption ? selectedOption.textContent.split(' (')[0] : period;

            if (period === 'MONTH' || period.startsWith('Q') || period === 'YEAR') {
                btnSave.classList.add('hidden');
                notice.classList.remove('hidden');

                let weeksToAggregate = [];
                const monthNum = parseInt(month.replace('M', ''));

                const monthWeeksMap = {
                    1: [1,2,3,4,5], 2: [6,7,8,9], 3: [10,11,12,13,14],
                    4: [15,16,17,18], 5: [19,20,21,22], 6: [23,24,25,26,27],
                    7: [28,29,30,31], 8: [32,33,34,35], 9: [36,37,38,39],
                    10: [40,41,42,43,44], 11: [45,46,47,48], 12: [49,50,51,52]
                };

                if (period === 'MONTH') {
                    weeksToAggregate = monthWeeksMap[monthNum] || [];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP CẢ THÁNG ${monthNum} - NĂM ${year}`;
                } else if (period === 'Q1') {
                    weeksToAggregate = [...monthWeeksMap[1], ...monthWeeksMap[2], ...monthWeeksMap[3]];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP QUÝ I - NĂM ${year}`;
                } else if (period === 'Q2') {
                    weeksToAggregate = [...monthWeeksMap[4], ...monthWeeksMap[5], ...monthWeeksMap[6]];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP QUÝ II - NĂM ${year}`;
                } else if (period === 'Q3') {
                    weeksToAggregate = [...monthWeeksMap[7], ...monthWeeksMap[8], ...monthWeeksMap[9]];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP QUÝ III - NĂM ${year}`;
                } else if (period === 'Q4') {
                    weeksToAggregate = [...monthWeeksMap[10], ...monthWeeksMap[11], ...monthWeeksMap[12]];
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP QUÝ IV - NĂM ${year}`;
                } else if (period === 'YEAR') {
                    for (let w = 1; w <= 52; w++) weeksToAggregate.push(w);
                    document.getElementById('tableTitle').textContent = `TỔNG HỢP CẢ NĂM ${year}`;
                }

                renderTables(true);

                let aggregated = cmaList.map(cma => ({
                    cma: cma,
                    categories: Array.from({length: categories.length}, () => ({tot: 0, on: 0}))
                }));

                let fetchPromises = [];

                weeksToAggregate.forEach(wNum => {
                    let primaryKey = `HUEWACO_${year}_WEEK_${wNum}`;
                    let timestamp = new Date().getTime();

                    let p = fetch(`${GOOGLE_SCRIPT_URL}?key=${primaryKey}&_t=${timestamp}`)
                        .then(res => res.json())
                        .then(data => {
                            let weekData = (typeof data === 'string') ? JSON.parse(data) : data;
                            if (weekData && Array.isArray(weekData) && weekData.length > 0) {
                                weekData.forEach((r, rIdx) => {
                                    if (r.categories) {
                                        r.categories.forEach((cat, cIdx) => {
                                            if (aggregated[rIdx] && aggregated[rIdx].categories[cIdx]) {
                                                aggregated[rIdx].categories[cIdx].tot += parseInt(cat.tot, 10) || 0;
                                                aggregated[rIdx].categories[cIdx].on += parseInt(cat.on, 10) || 0;
                                            }
                                        });
                                    }
                                });
                            } else {
                                let localData = localStorage.getItem(primaryKey);
                                if (localData) {
                                    let parsed = JSON.parse(localData);
                                    parsed.forEach((r, rIdx) => {
                                        if (r.categories) {
                                            r.categories.forEach((cat, cIdx) => {
                                                if (aggregated[rIdx] && aggregated[rIdx].categories[cIdx]) {
                                                    aggregated[rIdx].categories[cIdx].tot += parseInt(cat.tot, 10) || 0;
                                                    aggregated[rIdx].categories[cIdx].on += parseInt(cat.on, 10) || 0;
                                                }
                                            });
                                        }
                                    });
                                }
                            }
                        }).catch(err => {
                            let localData = localStorage.getItem(primaryKey);
                            if (localData) {
                                let parsed = JSON.parse(localData);
                                parsed.forEach((r, rIdx) => {
                                    if (r.categories) {
                                        r.categories.forEach((cat, cIdx) => {
                                            if (aggregated[rIdx] && aggregated[rIdx].categories[cIdx]) {
                                                aggregated[rIdx].categories[cIdx].tot += parseInt(cat.tot, 10) || 0;
                                                aggregated[rIdx].categories[cIdx].on += parseInt(cat.on, 10) || 0;
                                            }
                                        });
                                    }
                                });
                            }
                        });

                    fetchPromises.push(p);
                });

                Promise.all(fetchPromises).then(() => {
                    let fixedRows = document.querySelectorAll('#fixedTableBody tr');
                    let scrollRows = document.querySelectorAll('#scrollableTableBody tr');

                    aggregated.forEach((rData, rIdx) => {
                        let fixedRow = fixedRows[rIdx];
                        let scrollRow = scrollRows[rIdx];
                        let rTotAll = 0, rOnAll = 0;

                        if (fixedRow && scrollRow) {
                            rData.categories.forEach((cat, cIdx) => {
                                let c = cIdx + 1;
                                if (filter === "ALL" || filter == c) {
                                    let totElem = scrollRow.querySelector(`.cat-tot-${c}`);
                                    let onElem = scrollRow.querySelector(`.cat-on-${c}`);
                                    let pctElem = scrollRow.querySelector(`.cat-pct-${c}`);

                                    if (totElem) totElem.textContent = cat.tot;
                                    if (onElem) onElem.textContent = cat.on;
                                    if (pctElem) pctElem.textContent = cat.tot > 0 ? Math.round((cat.on / cat.tot) * 100) + '%' : '0%';
                                }
                                rTotAll += cat.tot;
                                rOnAll += cat.on;
                            });

                            fixedRow.querySelector('.row-total-all').textContent = rTotAll;
                            fixedRow.querySelector('.row-online-all').textContent = rOnAll;
                            fixedRow.querySelector('.row-pct-all').textContent = rTotAll > 0 ? Math.round((rOnAll / rTotAll) * 100) + '%' : '0%';
                        }
                    });

                    calculateTableTotals();
                });

            } else {
                btnSave.classList.remove('hidden');
                notice.classList.add('hidden');
                document.getElementById('tableTitle').textContent = `NHẬP LIỆU: ${displayPeriod.toUpperCase()} - THÁNG ${month.replace('M','')} - NĂM ${year}`;

                renderTables(false);

                let primaryKey = `HUEWACO_${year}_${period}`;

                // 1. HIỂN THỊ NGAY TỪ LOCALSTORAGE (0 GIÂY)
                let saved = localStorage.getItem(primaryKey);
                if (saved) {
                    try { applyDataToTable(JSON.parse(saved)); } catch(e) {}
                }

                // 2. CHẠY NGẦM FETCH TỪ GOOGLE SHEET ĐỂ CẬP NHẬT ĐỒNG BỘ
                if (typeof GOOGLE_SCRIPT_URL !== 'undefined' && GOOGLE_SCRIPT_URL) {
                    let timestamp = new Date().getTime();
                    fetch(`${GOOGLE_SCRIPT_URL}?key=${primaryKey}&_t=${timestamp}`)
                        .then(res => res.json())
                        .then(data => {
                            let cloudData = data;
                            if (typeof cloudData === 'string') {
                                try { cloudData = JSON.parse(cloudData); } catch(e) {}
                            }

                            if (cloudData && Array.isArray(cloudData) && cloudData.length > 0) {
                                applyDataToTable(cloudData);
                                localStorage.setItem(primaryKey, JSON.stringify(cloudData));
                            }
                        })
                        .catch(err => console.log("Không thể kết nối Cloud, giữ nguyên dữ liệu máy:", err));
                }
            }
        }

        function exportToExcel() {
            const year = document.getElementById('selectYear').value;
            const month = document.getElementById('selectMonth').value;
            const period = document.getElementById('selectPeriod').value;
            const filter = document.getElementById('selectCategoryFilter').value;
            const tableTitleText = document.getElementById('tableTitle').textContent.trim();

            let selectedCats = [];
            categories.forEach((cat, idx) => {
                let catId = idx + 1;
                if (filter === "ALL" || filter == catId) {
                    selectedCats.push({ name: cat, id: catId });
                }
            });

            const borderStyle = {
                top: { style: "thin", color: { rgb: "D1D5DB" } },
                bottom: { style: "thin", color: { rgb: "D1D5DB" } },
                left: { style: "thin", color: { rgb: "D1D5DB" } },
                right: { style: "thin", color: { rgb: "D1D5DB" } }
            };

            const styleTitle = {
                font: { bold: true, size: 14, color: { rgb: "1E3A8A" } },
                alignment: { horizontal: "center", vertical: "center" }
            };

            const styleHeaderTop = {
                fill: { fgColor: { rgb: "1E3A8A" } },
                font: { bold: true, color: { rgb: "FFFFFF" }, size: 10 },
                alignment: { horizontal: "center", vertical: "center", wrapText: true },
                border: borderStyle
            };

            const styleHeaderSub = {
                fill: { fgColor: { rgb: "1E293B" } },
                font: { bold: true, color: { rgb: "FDE047" }, size: 9 },
                alignment: { horizontal: "center", vertical: "center" },
                border: borderStyle
            };

            const styleHeaderTotalTop = {
                fill: { fgColor: { rgb: "D97706" } },
                font: { bold: true, color: { rgb: "FEF3C7" }, size: 10 },
                alignment: { horizontal: "center", vertical: "center" },
                border: borderStyle
            };

            const styleHeaderTotalSub = {
                fill: { fgColor: { rgb: "B45309" } },
                font: { bold: true, color: { rgb: "FFFFFF" }, size: 9 },
                alignment: { horizontal: "center", vertical: "center" },
                border: borderStyle
            };

            const styleCma = {
                fill: { fgColor: { rgb: "0F172A" } },
                font: { bold: true, color: { rgb: "FFFFFF" }, size: 9 },
                alignment: { horizontal: "center", vertical: "center" },
                border: borderStyle
            };

            const styleTotalLight = {
                fill: { fgColor: { rgb: "FEF3C7" } },
                font: { bold: true, color: { rgb: "1E3A8A" }, size: 9 },
                alignment: { horizontal: "center", vertical: "center" },
                border: borderStyle
            };

            const styleFoot = {
                fill: { fgColor: { rgb: "1E293B" } },
                font: { bold: true, color: { rgb: "FFFFFF" }, size: 10 },
                alignment: { horizontal: "center", vertical: "center" },
                border: borderStyle
            };

            const styleDataNum = {
                font: { size: 9 },
                alignment: { horizontal: "center", vertical: "center" },
                border: borderStyle
            };

            let wsData = [];
            let merges = [];

            wsData.push([tableTitleText]);
            const totalCols = 5 + (selectedCats.length * 3);
            merges.push({ s: { r: 0, c: 0 }, e: { r: 0, c: totalCols - 1 } });
            wsData.push([]); 

            let rowHeader1 = ["STT", "KHU VỰC", "TỔNG HỢP", "", ""];
            let rowHeader2 = ["", "", "TỔNG", "ONLINE", "%"];

            merges.push({ s: { r: 2, c: 0 }, e: { r: 3, c: 0 } }); 
            merges.push({ s: { r: 2, c: 1 }, e: { r: 3, c: 1 } }); 
            merges.push({ s: { r: 2, c: 2 }, e: { r: 2, c: 4 } }); 

            selectedCats.forEach((cat, idx) => {
                let startCol = 5 + (idx * 3);
                rowHeader1.push(cat.name, "", "");
                rowHeader2.push("TỔNG", "ONLINE", "%");
                merges.push({ s: { r: 2, c: startCol }, e: { r: 2, c: startCol + 2 } });
            });

            wsData.push(rowHeader1);
            wsData.push(rowHeader2);

            const fixedRows = document.querySelectorAll('#fixedTableBody tr');
            const scrollRows = document.querySelectorAll('#scrollableTableBody tr');

            fixedRows.forEach((fixedRow, rIdx) => {
                const scrollRow = scrollRows[rIdx];
                let rowData = [];

                rowData.push(rIdx + 1);
                rowData.push(cmaList[rIdx]);
                rowData.push(parseInt(fixedRow.querySelector('.row-total-all').textContent) || 0);
                rowData.push(parseInt(fixedRow.querySelector('.row-online-all').textContent) || 0);
                rowData.push(fixedRow.querySelector('.row-pct-all').textContent);

                selectedCats.forEach(cat => {
                    let c = cat.id;
                    let tot = scrollRow.querySelector(`.tot-${c}`) ? 
                        (parseInt(scrollRow.querySelector(`.tot-${c}`).value) || 0) : 
                        (parseInt(scrollRow.querySelector(`.cat-tot-${c}`)?.textContent) || 0);

                    let on = scrollRow.querySelector(`.on-${c}`) ? 
                        (parseInt(scrollRow.querySelector(`.on-${c}`).value) || 0) : 
                        (parseInt(scrollRow.querySelector(`.cat-on-${c}`)?.textContent) || 0);

                    let pct = scrollRow.querySelector(`.pct-${c}`) ? 
                        scrollRow.querySelector(`.pct-${c}`).textContent : 
                        (scrollRow.querySelector(`.cat-pct-${c}`)?.textContent || "0%");

                    rowData.push(tot, on, pct);
                });

                wsData.push(rowData);
            });

            let footRow = ["--", "HueWACO"];
            footRow.push(parseInt(document.getElementById('footTotalAll').textContent) || 0);
            footRow.push(parseInt(document.getElementById('footOnlineAll').textContent) || 0);
            footRow.push(document.getElementById('footPctAll').textContent);

            selectedCats.forEach(cat => {
                let c = cat.id;
                let tot = parseInt(document.getElementById(`footCatTot-${c}`)?.textContent) || 0;
                let on = parseInt(document.getElementById(`footCatOn-${c}`)?.textContent) || 0;
                let pct = document.getElementById(`footCatPct-${c}`)?.textContent || "0%";
                footRow.push(tot, on, pct);
            });

            wsData.push(footRow);

            const ws = XLSX.utils.aoa_to_sheet(wsData);
            ws['!merges'] = merges;

            let colWidths = [{ wch: 6 }, { wch: 15 }, { wch: 10 }, { wch: 10 }, { wch: 8 }];
            selectedCats.forEach(() => {
                colWidths.push({ wch: 10 }, { wch: 10 }, { wch: 8 });
            });
            ws['!cols'] = colWidths;

            const range = XLSX.utils.decode_range(ws['!ref']);
            for (let R = range.s.r; R <= range.e.r; ++R) {
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const cell_address = XLSX.utils.encode_cell({ r: R, c: C });
                    if (!ws[cell_address]) continue;

                    if (R === 0) {
                        ws[cell_address].s = styleTitle;
                    } else if (R === 2) {
                        if (C < 2) ws[cell_address].s = styleHeaderTop;
                        else if (C >= 2 && C <= 4) ws[cell_address].s = styleHeaderTotalTop;
                        else ws[cell_address].s = styleHeaderTop;
                    } else if (R === 3) {
                        if (C < 2) ws[cell_address].s = styleHeaderTop;
                        else if (C >= 2 && C <= 4) ws[cell_address].s = styleHeaderTotalSub;
                        else ws[cell_address].s = styleHeaderSub;
                    } else if (R === range.e.r) {
                        ws[cell_address].s = styleFoot;
                    } else {
                        if (C === 0 || C === 1) ws[cell_address].s = styleCma;
                        else if (C >= 2 && C <= 4) ws[cell_address].s = styleTotalLight;
                        else ws[cell_address].s = styleDataNum;
                    }
                }
            }

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "TongHopOnline");
            
            let fileName = `BaoCao_Online_HueWACO_${year}_${month}_${period}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }

        initTime();
        loadData();
    </script>
